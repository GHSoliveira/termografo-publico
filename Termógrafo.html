  function placeTip(x, y) {
    const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
    let left = x + pad, top = y + pad;
    if (left + w > innerWidth - 8) left = x - w - pad;
    if (top + h > innerHeight - 8) top = y - h - pad;
    tip.style.left = Math.max(8, left) + 'px'; tip.style.top = Math.max(8, top) + 'px';
  }

  hm.addEventListener('pointermove', e => {
    const el = e.target.closest('.cell');
    if (!el) { setHot(null); return; }
    if (el !== hot) setHot(el);
    placeTip(e.clientX, e.clientY);
  });
  hm.addEventListener('pointerleave', () => { if (!hm.contains(document.activeElement)) setHot(null); });
  hm.addEventListener('focusin', e => {
    const el = e.target.closest('.cell'); if (!el) return;
    cellEls.flat().forEach(x => x.tabIndex = -1); el.tabIndex = 0;
    setHot(el);
    const rc = el.getBoundingClientRect(); placeTip(rc.right - 4, rc.bottom - 4);
  });
  hm.addEventListener('focusout', e => { if (!hm.contains(e.relatedTarget)) setHot(null); });
  hm.addEventListener('keydown', e => {
    const el = e.target.closest('.cell'); if (!el) return;
    if (e.key === 'Escape') { el.blur(); return; }
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); abrirPainel(el); return; }
    const mv ={ ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
    if (!mv) return;
    e.preventDefault();
    cellEls[+el.dataset.r + mv[0]]?.[+el.dataset.c + mv[1]]?.focus();
  });
  addEventListener('scroll', () => { if (hot && document.activeElement !== hot) setHot(null); }, { passive: true });

  // ---------- janela de detalhes ----------
  const painel = document.getElementById('painel'), pHead = document.getElementById('pHead');
  const $p = id => document.getElementById(id);
  const PROBLEMA = { sem_conexao: 'Sem conexão', lentidao: 'Lentidão' };
  const DOW_SEG = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
  let sel = null; // { k: cidade, ci: coluna, gran }
  let painelTudo = false; // lista de O.S. aberta por inteiro
  $p('pMais').addEventListener('click', () => { painelTudo = !painelTudo; preencherPainel(); });

  hm.addEventListener('click', e => { const el = e.target.closest('.cell'); if (el) abrirPainel(el); });

  function abrirPainel(el) {
    const novo = { k: ordem[+el.dataset.r], ci: +el.dataset.c, gran: ui.gran };
    if (!sel || sel.k !== novo.k || sel.ci !== novo.ci || sel.gran !== novo.gran) painelTudo = false;
    sel = novo;
    marcarSel(); preencherPainel();
    painel.hidden = false;
    posicionarPadrao();
  }
  // posição fixa: canto superior direito, logo abaixo da barra de menus
  function posicionarPadrao() {
    const topo = document.querySelector('.bar').getBoundingClientRect().bottom;
    moverPainel(innerWidth - painel.offsetWidth - 16, topo + 16);
  }
  function fecharPainel() { sel = null; marcarSel(); painel.hidden = true; }
  function marcarSel() {
    hm.querySelectorAll('.cell.sel').forEach(x => x.classList.remove('sel'));
    if (sel) cellEls[ordem.indexOf(sel.k)]?.[sel.ci]?.classList.add('sel');
  }
  function moverPainel(x, y) {
    const w = painel.offsetWidth, h = painel.offsetHeight;
    x = Math.min(Math.max(8, x), Math.max(8, innerWidth - w - 8));
    y = Math.min(Math.max(8, y), Math.max(8, innerHeight - Math.min(h, 120) - 8));
    painel.style.left = x + 'px'; painel.style.top = y + 'px';
  }

  // divisão interna do período para o mini gráfico
  function fatias(gran, t0, t1) {
    const ini = new Date(t0);
    if (gran === 'hora') return { n: 6, titulo: 'A cada 10 minutos', idx: t => Math.floor((t - t0) / 6e5),
      inicio: i => t0.getTime() + i * 6e5, rot: i => ':' + dd(i * 10), mostra: () => true };
    if (gran === 'dia') return { n: 24, titulo: 'Por hora', idx: t => new Date(t).getHours(),
      inicio: i => new Date(ini.getFullYear(), ini.getMonth(), ini.getDate(), i).getTime(), rot: i => dd(i) + 'h', mostra: i => i % 6 === 0 };
    if (gran === 'sem') return { n: 7, titulo: 'Por dia', idx: t => { const d = new Date(t); return Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - t0) / 864e5); },
      inicio: i => new Date(ini.getFullYear(), ini.getMonth(), ini.getDate() + i).getTime(), rot: i => DOW_SEG[i], mostra: () => true };
    const n = new Date(ini.getFullYear(), ini.getMonth() + 1, 0).getDate();
    return { n, titulo: 'Por dia', idx: t => new Date(t).getDate() - 1,
      inicio: i => new Date(ini.getFullYear(), ini.getMonth(), i + 1).getTime(), rot: i => String(i + 1), mostra: i => i % 7 === 0 };
  }

  function preencherPainel() {
    if (!sel) return;
    const { k, ci } = sel, col = V.cols[ci], c = V.cells[k][ci], F = FILTRO[ui.filtro];
    const v = F.val(c), esp = esperadoDe(k, c), n = nivel(v, esp), clientes = CIDADES[k][2];
    const t0 = col.t0.getTime(), t1 = col.t1.getTime();

    $p('pTitulo').textContent = CIDADES[k][0];
    $p('pSub').textContent = c.where + (c.kind === 'partial' ? ' · em andamento' : '');
    $p('pChip').querySelector('i').style.background = corNivel(n);
    $p('pChip').querySelector('span').textContent = NIVEIS[n] + (ui.filtro === 'todas' ? '' : ` · ${ui.filtro === 'sc' ? 'sem conexão' : 'lentidão'}`);
    $p('pOS').textContent = nf0.format(v);
    $p('pEsp').textContent = nf1.format(esp);
    const desvio = esp > 0 ? Math.round((v / esp - 1) * 100) : null;
    $p('pDesv').textContent = desvio === null ? '—' : `${desvio > 0 ? '+' : ''}${desvio}%`;

    // por problema (sempre os dois, independente do filtro)
    const tot = c.sc + c.len;
    $p('pSplit').innerHTML = tot
      ? `<span style="width:${c.sc / tot * 100}%;background:var(--c-sc)"></span><span style="width:${c.len / tot * 100}%;background:var(--c-len)"></span>`
      : '';
    $p('pLeg').innerHTML = `<span><i style="background:var(--c-sc)"></i>Sem conexão <b>${nf0.format(c.sc)}</b> · ${pct(c.sc, tot)}</span>`
                         + `<span><i style="background:var(--c-len)"></i>Lentidão <b>${nf0.format(c.len)}</b> · ${pct(c.len, tot)}</span>`;

    // O.S. da cidade no período, respeitando o filtro
    const aceita = os => ui.filtro === 'todas' || (ui.filtro === 'sc') === (os.problema === 'sem_conexao');
    const lista = TODAS_OS.filter(os => os.cidade === k && os.criadaEm >= t0 && os.criadaEm < t1 && aceita(os));

    // mini gráfico empilhado
    const fz = fatias(sel.gran, col.t0, col.t1);
    const sc = new Array(fz.n).fill(0), len = new Array(fz.n).fill(0);
    for (const os of lista) { const i = fz.idx(os.criadaEm); if (i >= 0 && i < fz.n) (os.problema === 'sem_conexao' ? sc : len)[i]++; }
    const max = Math.max(1, ...sc.map((x, i) => x + len[i]));
    const mini = $p('pMini'), eixo = $p('pMiniX');
    mini.style.gridTemplateColumns = eixo.style.gridTemplateColumns = `repeat(${fz.n}, 1fr)`;
    mini.innerHTML = sc.map((x, i) => {
      if (fz.inicio(i) > agora) return `<div class="b fut" title="${fz.rot(i)}: ainda não chegou"></div>`;
      const y = len[i];
      return `<div class="b" title="${fz.rot(i)}: ${x + y} O.S.">`
        + (x ? `<span style="height:${x / max * 100}%;background:var(--c-sc)"></span>` : '')
        + (y ? `<span style="height:${y / max * 100}%;background:var(--c-len)"></span>` : '')
        + '</div>';
    }).join('');
    eixo.innerHTML = sc.map((_, i) => `<span>${fz.mostra(i) ? fz.rot(i) : ''}</span>`).join('');
    $p('pMiniT').textContent = `Distribuição · ${fz.titulo.toLowerCase()}`;

    $p('pBase').textContent = `${rotuloFilial(k).replace(/^f/, 'F')} · ` + (clientes
      ? `${nf0.format(clientes)} clientes · ${nf1.format(v / clientes * 1000)} O.S. por mil clientes`
      : 'base de clientes não cadastrada na página.');

    // O.S. e clientes: as 8 mais recentes; "mostrar todas" abre a lista inteira
    const ul = $p('pLista'), mais = $p('pMais');
    ul.textContent = '';
    const ordenadas = lista.slice().sort((a, b) => b.criadaEm - a.criadaEm);
    const visiveis = painelTudo ? ordenadas : ordenadas.slice(0, 8);
    const comData = sel.gran === 'sem' || sel.gran === 'mes';
    const nClientes = new Set(lista.map(os => os.cliente).filter(Boolean)).size;
    $p('pListaT').textContent = `O.S. e clientes · ${nf0.format(lista.length)} O.S.` + (nClientes ? `, ${nf0.format(nClientes)} cliente${nClientes === 1 ? '' : 's'}` : '');
    if (!visiveis.length) ul.innerHTML = '<li class="vazio-msg">Nenhuma O.S. neste período.</li>';
    for (const os of visiveis) {
      const d = new Date(os.criadaEm), li = document.createElement('li');
      const hora = (comData ? `${dd(d.getDate())}/${dd(d.getMonth() + 1)} ` : '') + `${dd(d.getHours())}:${dd(d.getMinutes())}`;
      li.innerHTML = `<span class="cli"></span><span class="p"><i style="background:var(${os.problema === 'sem_conexao' ? '--c-sc' : '--c-len'})"></i></span><span class="meta"></span>`;
      const cli = li.querySelector('.cli');
      cli.textContent = os.cliente || 'cliente não informado';
      cli.classList.toggle('sem', !os.cliente);
      li.querySelector('.meta').textContent = `${os.id} · ${hora}`;
      li.querySelector('.p').append(PROBLEMA[os.problema]);
      ul.appendChild(li);
    }
    mais.hidden = ordenadas.length <= 8;
    mais.textContent = painelTudo ? 'Mostrar só as 8 mais recentes' : `Mostrar todas as ${nf0.format(ordenadas.length)} O.S.`;
    pintarBotaoIncidente();
  }

  // ---------- incidentes (salvos neste navegador) ----------
  const GRAN_NOME = { hora: 'Hora a hora', dia: 'Diário', sem: 'Semanal', mes: 'Mensal' };
  const quando = ms => { const d = new Date(ms); return `${dd(d.getDate())}/${dd(d.getMonth() + 1)} às ${dd(d.getHours())}:${dd(d.getMinutes())}`; };
  let listaInc = [];
  listaInc = carregarIncidentes();

  function carregarIncidentes() {
    try { const x = JSON.parse(store.get('incidentes.v1')); if (Array.isArray(x)) return x; } catch {}
    const exemplos = USAR_EXEMPLO ? semearIncidentes() : []; // modo real: sem incidentes de exemplo
    store.set('incidentes.v1', JSON.stringify(exemplos));
    return exemplos;
  }
  function salvarIncidentes() { store.set('incidentes.v1', JSON.stringify(listaInc)); }
  function proximoId() {
    const ano = new Date(agora).getFullYear();
    const n = Math.max(0, ...listaInc.map(i => +i.id.split('-')[2] || 0)) + 1;
    return `INC-${ano}-${String(n).padStart(4, '0')}`;
  }
  function novoIncidente(gran, k, ci, v, filtro, resolvidoEm) {
    const col = v.cols[ci], c = v.cells[k][ci], F = FILTRO[filtro];
    const med = (() => { const x = v.cells[k].filter(z => z.kind === 'ok').map(F.val); return x.length ? x.reduce((a, b) => a + b, 0) / x.length : 0; })();
    const os = F.val(c), esp = med * c.fracao;
    return { id: proximoId(), chave: `${gran}|${k}|${col.t0.getTime()}`, cidade: k, gran, t0: col.t0.getTime(), periodo: c.where,
             filtro, os, esperado: esp, nivel: nivel(os, esp, gran), status: resolvidoEm ? 'resolvido' : 'aberto',
             criadoEm: Date.now(), resolvidoEm: resolvidoEm || null,
             clientes: clientesDe([k], col.t0.getTime(), col.t1.getTime(), filtro) };
  }
  // exemplos: os três dias mais críticos dos últimos 30, já resolvidos
  function semearIncidentes() {
    listaInc = [];
    const v = view('dia'), F = FILTRO.todas, cand = [];
    v.cells.forEach((linha, k) => {
      const x = linha.filter(z => z.kind === 'ok').map(F.val), med = x.reduce((a, b) => a + b, 0) / x.length;
      linha.forEach((c, ci) => { if (c.kind === 'ok' && nivel(F.val(c), med, 'dia') === 3) cand.push({ k, ci, d: F.val(c) / med }); });
    });
    cand.sort((a, b) => b.d - a.d).slice(0, 3).sort((a, b) => a.ci - b.ci).forEach(({ k, ci }) => {
      const t0 = v.cols[ci].t0.getTime(), inc = novoIncidente('dia', k, ci, v, 'todas', t0 + 14.5 * 36e5);
      inc.criadoEm = t0 + 11 * 36e5;
      listaInc.push(inc);
    });
    return listaInc;
  }

  // ---------- aba Incidentes: uma lista só ----------
  // Incidentes gerados no mapa (cidade ou filial) e O.S. técnicas de rede no mesmo formato de cartão.
  // Uma O.S. técnica está resolvida quando o incidente foi encerrado ou todos os chamados dela já tiveram baixa.
  const osAberta = o => !o.encerradaEm && o.eventos.some(id => EVENTOS.get(id)?.status !== 'encerrado');
  const incidentesAbertos = () => listaInc.filter(i => i.status === 'aberto').length + [...OSS.values()].filter(osAberta).length;
  const incDetAbertos = new Set(); // cartões com "Detalhes" aberto (continuam abertos nas atualizações ao vivo)
  let incDestaque = null;
  const digitandoEm = el => el.contains(document.activeElement) && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);

  function renderIncidentes() {
    const box = document.getElementById('incs');
    if (digitandoEm(box)) return; // não apaga o que está sendo digitado (ex.: status da O.S.)
    const rolagem = document.querySelector('main').scrollTop;
    box.textContent = '';
    const filtra = aberto => ui.incSt === 'todos' || (ui.incSt === 'abertos') === aberto;
    const itens = [
      ...[...OSS.values()].map(o => ({ chave: 'os:' + o.numero, aberto: osAberta(o), criado: o.abertaEm, montar: () => cartaoOS(o) })),
      ...listaInc.map(inc => ({ chave: 'inc:' + inc.id, aberto: inc.status === 'aberto', criado: inc.criadoEm, montar: () => cartaoIncidenteMapa(inc) }))
    ].filter(i => filtra(i.aberto)).sort((a, b) => b.aberto - a.aberto || b.criado - a.criado); // abertos primeiro, mais recentes em cima
    if (!itens.length) {
      box.innerHTML = ui.incSt === 'resolvidos'
        ? '<div class="inc-vazio"><b>Nenhum incidente resolvido.</b>Incidentes resolvidos e O.S. técnicas encerradas aparecem aqui.</div>'
        : '<div class="inc-vazio"><b>Nenhum incidente aberto.</b>Gere um incidente pelo mapa ou pelo Monitor, ou abra uma O.S. técnica num chamado da aba Rede.</div>';
      return;
    }
    for (const it of itens) {
      const card = it.montar();
      card.dataset.chave = it.chave;
      card.classList.toggle('sel', incDestaque === it.chave);
      // "Detalhes" lembra se estava aberto
      const det = card.querySelector('.inc-det');
      if (det) {
        det.open = incDetAbertos.has(it.chave);
        det.addEventListener('toggle', () => det.open ? incDetAbertos.add(it.chave) : incDetAbertos.delete(it.chave));
      }
      box.appendChild(card);
    }
    document.querySelector('main').scrollTop = rolagem;
  }

  // esqueleto comum dos cartões
  function cartaoBase({ nivel, origem, titulo, id, linha, quando, numero, numeroSub, pill, acoes }) {
    const card = document.createElement('article'); card.className = 'inc-card';
    card.innerHTML = `
      <span class="inc-dot" style="background:${tomNivel(nivel)}" title="${NIVEIS[nivel]}"></span>
      <div class="inc-main">
        <div class="inc-top"><span class="inc-orig"></span><b></b><span class="inc-id"></span></div>
        <div class="inc-per"></div>
        <div class="inc-quando"></div>
      </div>
      <div class="inc-num"><b></b><span></span></div>
      <div class="inc-acoes">${pill}${acoes}</div>
      <details class="inc-det"><summary>Detalhes</summary><div class="inc-det-corpo"></div></details>`;
    const detEl = card.querySelector('.inc-det');
    detEl.querySelector('summary').addEventListener('click', () => { if (!detEl.open) suave(detEl.querySelector('.inc-det-corpo'), 4, 240); });
    card.querySelector('.inc-orig').textContent = origem;
    card.querySelector('.inc-top b').textContent = titulo;
    card.querySelector('.inc-id').textContent = id;
    card.querySelector('.inc-per').textContent = linha;
    card.querySelector('.inc-quando').innerHTML = quando;
    card.querySelector('.inc-num b').textContent = numero;
    card.querySelector('.inc-num span').textContent = numeroSub;
    return card;
  }
  const campo = (rotulo, valor, largo) => `<div class="inc-campo${largo ? ' largo' : ''}"><dt>${rotulo}</dt><dd>${valor}</dd></div>`;

  // envio automático do comunicado ao grupo de incidentes do CGR (WhatsApp): só o indicativo por enquanto
  const ICONE_WPP = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 5.5h15v10h-9l-4.5 3.5v-3.5h-1.5z"/></svg>';
  // indicativo discreto do último envio da O.S. (o servidor manda ao abrir, atualizar e encerrar)
  function wppHtml(o) {
    const grupo = escHtml(SERVIDOR?.grupo || 'Incidentes CGR');
    if (!SERVIDOR?.whatsapp) return `<span class="wpp" title="Quando a integração estiver configurada, o comunicado e as atualizações vão sozinhos para o grupo de incidentes do CGR no WhatsApp.">${ICONE_WPP}Grupo CGR · envio automático não configurado</span>`;
    const w = o?.whatsapp;
    if (!w) return `<span class="wpp" title="O comunicado vai sozinho para o grupo ${grupo} ao abrir, atualizar e encerrar a O.S.">${ICONE_WPP}Grupo ${grupo} · não enviado</span><button type="button" class="btn-link" data-reenviar>Enviar</button>`;
    if (w.status === 'enviado') return `<span class="wpp ok" title="Último envio ao grupo: ${escHtml(w.motivo)}">${ICONE_WPP}Enviado ao grupo ${grupo} às ${hhmm(w.em)}</span>`;
    return `<span class="wpp falhou" title="${escHtml(w.erro || 'falha no envio')}">${ICONE_WPP}Falha ao enviar ao grupo (${escHtml(w.motivo)})</span><button type="button" class="btn-link" data-reenviar>Reenviar</button>`;
  }
  // copiar o comunicado é secundário: serve para encaminhar ao supervisor técnico
  function copiarComunicado(bt, texto, pre) {
    const rotulo = bt.textContent, voltar = () => setTimeout(() => { bt.textContent = rotulo; }, 1800);
    navigator.clipboard.writeText(texto)
      .then(() => { bt.textContent = 'Copiado'; voltar(); })
      .catch(() => { // sem acesso à área de transferência: seleciona o texto para Ctrl+C
        const r = document.createRange(); r.selectNodeContents(pre);
        const sl = getSelection(); sl.removeAllRanges(); sl.addRange(r);
        bt.textContent = 'Texto selecionado: use Ctrl+C'; voltar();
      });
  }
  const avisosOS = new Map(); // número -> aviso da última atualização (ex.: PON sem resposta)
  // encerramento pelo operador: O.S. com o formulário aberto e o rascunho (sobrevive às atualizações ao vivo)
  let encerrandoOS = null;
  const rascunhoFim = new Map(); // número -> { fim: 'aaaa-mm-ddThh:mm', msg }
  const QUEM_ENCERROU = { supervisor: 'pelo supervisor de redes', operador: 'pelo operador' };
  const focarNoCartao = (numero, sel) => { const el = document.querySelector(`[data-chave="os:${numero}"] ${sel}`); el?.focus(); el?.select?.(); };

  function formEncerrar(o) {
    return `<form class="rd-baixa inc-fim" novalidate>
      <h4>Encerrar incidente</h4>
      <div class="inc-fim-linha"><label for="fim-${escHtml(o.numero)}">Fim do incidente</label>
        <input type="datetime-local" id="fim-${escHtml(o.numero)}" required></div>
      <label for="msgFim-${escHtml(o.numero)}">Mensagem de encerramento <span>(obrigatória)</span></label>
      <textarea id="msgFim-${escHtml(o.numero)}" rows="3" maxlength="500" placeholder="Ex.: fibra emendada na Av. Brasil, clientes normalizados às 23:10."></textarea>
      <div class="rd-baixa-acoes"><button type="submit" class="btn-sm">Encerrar incidente</button><button type="button" class="btn-sm ghost" data-cancelar>Cancelar</button><small></small></div>
      <p class="rd-erro" hidden></p></form>`;
  }
  function blocoEncerramento(o) {
    return `<div class="inc-bloco"><h4>Encerramento</h4>
      <p class="inc-fim-txt">Encerrado ${QUEM_ENCERROU[o.encerradaPor] || ''} em ${dataHora(o.encerradaEm)} · fim do incidente ${dataComunicado(o.fim)} · durou ${duracaoTxt(o.inicio, o.fim)}</p>
      ${o.mensagemFim ? `<p class="inc-msg-fim">${escHtml(o.mensagemFim)}</p>` : ''}</div>`;
  }

  function cartaoOS(o) {
    const aberta = osAberta(o), nivel = o.clientes >= 200 ? 3 : o.clientes >= 80 ? 2 : o.clientes >= 20 ? 1 : 0;
    const cat = categoriaDe(o), rotPorta = ROTULO_PORTA[cat] || 'PON', rotPortasPlural = ROTULO_PORTAS_PLURAL[cat] || 'portas';
    const prazo = o.encerradaEm ? `durou ${duracaoTxt(o.inicio, o.fim)}` : !aberta ? 'resolvida'
      : o.previsao < agora ? `<span class="inc-atraso">atrasada há ${duracaoTxt(o.previsao, agora)}</span>` : `faltam ${duracaoTxt(agora, o.previsao)}`;
    const mudou = o.clientesAbertura != null && o.clientesAbertura !== o.clientes;
    const encerrando = aberta && encerrandoOS === o.numero;
    const card = cartaoBase({
      nivel: aberta ? nivel : 0, origem: `Rede · ${NOME_CAT[cat] || 'GPON'}`, titulo: o.olt, id: `Comunicado ${o.id}`,
      linha: [nomeTipo(o.tipo), o.portas.length && `${rotPorta} ${o.portas.join(', ')}`, o.cidades.join(' / ')].filter(Boolean).join(' · '),
      quando: o.encerradaEm ? `Aberta ${quando(o.abertaEm)} · fim ${dataComunicado(o.fim)} · ${prazo}` : `Aberta ${quando(o.abertaEm)} · previsão ${dataComunicado(o.previsao)} · ${prazo}`,
      numero: `${nf0.format(o.clientes)} clientes`,

        ${campo('Clientes afetados', `<b class="mono">${nf0.format(o.clientes)}</b> ${o.clientesEm && o.clientesEm !== o.abertaEm ? `recalculado às ${hhmm(o.clientesEm)}` : 'na abertura'}${mudou ? ` · ${nf0.format(o.clientesAbertura)} na abertura` : ''}`)}

      ${encerrando ? formEncerrar(o) : ''}${o.encerradaEm ? blocoEncerramento(o) : ''}
      ${aberta && !encerrando ? `<div class="inc-bloco"><h4>Atualizar O.S.</h4>

          <button type="button" class="btn-sm" data-status>Recalcular clientes e atualizar</button></div>
        <p class="inc-nota">Consulta o monitoramento e recalcula os clientes afetados antes de atualizar o comunicado.</p>

      <div class="inc-bloco"><h4>Histórico</h4><ol class="rd-hist">${hist}</ol></div>
      <div class="inc-bloco inc-comunicado">
        <div class="inc-com-cab"><h4>Comunicado</h4>${wppHtml(o)}<button type="button" class="btn-link" data-copiar>Copiar para encaminhar ao supervisor</button></div>
        <pre class="rd-comunicado"></pre></div>`;
    const pre = card.querySelector('pre'), erro = card.querySelector('.rd-erro');
    pre.textContent = textoComunicado(o);
    if (aviso && erro) erro.textContent = aviso;
    card.querySelector('[data-copiar]').addEventListener('click', ev => copiarComunicado(ev.currentTarget, textoComunicado(o), pre));
    card.querySelectorAll('[data-evento]').forEach(b => b.addEventListener('click', () => abrirEventoRede(b.dataset.evento)));
    card.querySelector('[data-reenviar]')?.addEventListener('click', async ev => {
      const bt = ev.currentTarget, rotulo = bt.textContent;
      bt.disabled = true; bt.textContent = 'Enviando…';

        const r = await fetch('api/rede/os/whatsapp', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ numero: o.numero }) });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.erro || `o servidor respondeu ${r.status}`);

    card.querySelector('[data-ir-atualizar]')?.addEventListener('click', () => {
      if (encerrando) { encerrandoOS = null; renderIncidentes(); focarNoCartao(o.numero, '.of-status input'); return; }
      card.querySelector('.inc-det').open = true;

    card.querySelector('[data-ir-encerrar]')?.addEventListener('click', () => {
      encerrandoOS = o.numero; incDetAbertos.add('os:' + o.numero);
      renderIncidentes(); focarNoCartao(o.numero, '.inc-fim textarea');

    });
    const fForm = card.querySelector('.inc-fim');
    if (fForm) {
      const r = rascunhoFim.get(o.numero) || { fim: paraLocal(Date.now()), msg: '' };

      const campoFim = fForm.querySelector('input'), txt = fForm.querySelector('textarea'), cont = fForm.querySelector('small'), erroF = fForm.querySelector('.rd-erro');
      const contar = () => { cont.textContent = `${txt.value.length}/500`; };
      campoFim.min = paraLocal(o.inicio); campoFim.max = paraLocal(Date.now());
      campoFim.value = r.fim; txt.value = r.msg; contar();
      campoFim.addEventListener('input', () => { r.fim = campoFim.value; erroF.hidden = true; });
      txt.addEventListener('input', () => { r.msg = txt.value; erroF.hidden = true; contar(); });
      fForm.addEventListener('keydown', ev => { if (ev.key === 'Escape') fForm.querySelector('[data-cancelar]').click(); });
      fForm.querySelector('[data-cancelar]').addEventListener('click', () => { encerrandoOS = null; renderIncidentes(); });
      fForm.addEventListener('submit', async ev => {
        ev.preventDefault();
        const msg = txt.value.trim(), fim = new Date(campoFim.value).getTime();
        const falha = m => { erroF.textContent = m; erroF.hidden = false; };
        if (!campoFim.value || Number.isNaN(fim)) return falha('Informe a data e a hora em que o incidente acabou.');
        if (fim > Date.now() + 60000) return falha('O fim do incidente não pode ser no futuro.');
        if (fim < o.inicio - 60000) return falha(`O fim não pode ser antes do início do alarme (${dataComunicado(o.inicio)}).`);
        if (!msg) { txt.focus(); return falha('Escreva a mensagem de encerramento: o que aconteceu e como foi resolvido.'); }
        const bt = fForm.querySelector('[type=submit]');
        bt.disabled = true; bt.innerHTML = '<span class="spin"></span><span class="tx">Encerrando…</span>';
        try {

          OSS.set(j.os.numero, j.os);
          (j.eventos || []).forEach(e => EVENTOS.set(e.id, normalizarEvento(e)));
          rascunhoFim.delete(o.numero); encerrandoOS = null;
          document.activeElement?.blur();

        } catch (err) {
          bt.disabled = false; bt.textContent = 'Encerrar incidente';
          falha(`Não foi possível encerrar: ${err.message}.`);

        const j = await r.json().catch(() => ({}));

      }

    return card;
  }

  // abre a aba Incidentes com a O.S. técnica em destaque e os detalhes abertos

  // clientes afetados: lista recolhida no cartão, com "Copiar nomes" (uma linha por cliente)

  // ---------- gerar incidente ----------
  const btnInc = $p('pInc');

  const chaveIncidente = () => `${sel.gran}|${sel.k}|${V.cols[sel.ci].t0.getTime()}`;
  const CHECK = '<svg class="ok-ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11"/><path d="M7 12.4l3.3 3.3L17 9"/></svg>';
  function pintarBotaoIncidente(animar = false) {
    const ch = chaveIncidente();

    btnInc.querySelector('.tx').textContent = st === 'loading' ? 'Gerando incidente…' : st === 'done' ? 'Incidente gerado' : 'Gerar incidente';
  }
  btnInc.addEventListener('click', () => {

    const inc = novoIncidente(sel.gran, sel.k, sel.ci, V, ui.filtro); // retrato do momento do clique

      hm.querySelectorAll('.cell').forEach(el => { const k = ordem[+el.dataset.r]; if (`${ui.gran}|${k}|${V.cols[+el.dataset.c].t0.getTime()}` === chave) el.classList.add('inc'); });
      if (sel && chaveIncidente() === chave) pintarBotaoIncidente(true);

  // ---------- incidente da filial inteira ----------
  // Gerado pelos cartões de filial do Monitor ou pelo toast de problema massivo da filial.
  // Um por filial a cada hora; registra as cidades afetadas naquele momento.
  const horaAtualT0 = () => new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate(), hoje.getHours()).getTime();
  const chaveFilial = fid => `F|${fid}|${horaAtualT0()}`;
  const estadoChave = ch => gerando.has(ch) ? 'loading' : listaInc.some(i => i.chave === ch) ? 'done' : 'idle';

  function pintarBotaoPequeno(bt, st, animar = false) {

    bt.setAttribute('aria-busy', String(st === 'loading'));

      : st === 'done' ? `${CHECK}<span class="tx">Incidente gerado</span>` : '<span class="tx">Gerar incidente</span>';
  }
  // todos os botões de incidente de filial na tela (monitor e toasts) mostram o mesmo estado
  function atualizarBotoesFilial(recemGerada) {

  function atualizarBadge() {

    badge.hidden = !abertos; badge.textContent = abertos;
  }

  function gerarIncidenteFilial(fid) {
    const chave = chaveFilial(fid);
    if (estadoChave(chave) !== 'idle') return;
    // retrato do momento do clique
    const r = riscosPorFilial(calcularRiscos(FILTRO.todas, view('hora'), 'todas')).find(x => x.f.id === fid);
    const afetadas = (r.alerta.length ? r.alerta : r.cidades.filter(c => c.u60 > c.esp)).slice().sort((a, b) => b.u60 - a.u60);
    const fim = new Date(agora);
    const inc = {
      id: '', escopo: 'filial', chave, filial: fid, gran: 'hora', t0: horaAtualT0(), filtro: 'todas',
      cidades: afetadas.map(c => c.k), cidadesNomes: afetadas.map(c => CIDADES[c.k][0]),
      clientes: clientesDe(afetadas.map(c => c.k), agora - 36e5, agora + 1),
      periodo: `Última hora até ${dd(fim.getHours())}:${dd(fim.getMinutes())}`,
      os: r.u60, esperado: r.esp, nivel: r.p >= 0.75 ? 3 : r.p >= 0.5 ? 2 : r.p >= 0.25 ? 1 : 0,
      status: 'aberto', criadoEm: 0, resolvidoEm: null
    };
    gerando.add(chave);

    setTimeout(() => {

  function verFilialNoMapa(fid) {

  // arrastar pelo topo
  let arraste = null;

    const r = painel.getBoundingClientRect(); arraste = { dx: e.clientX - r.left, dy: e.clientY - r.top };
    pHead.setPointerCapture(e.pointerId);
    painel.classList.add('arrastando');
  });
  pHead.addEventListener('pointermove', e => { if (arraste) moverPainel(e.clientX - arraste.dx, e.clientY - arraste.dy); });
  const soltar = () => { arraste = null; painel.classList.remove('arrastando'); };
  pHead.addEventListener('pointerup', soltar);
  pHead.addEventListener('pointercancel', soltar);
  $p('pFechar').addEventListener('click', fecharPainel);
  addEventListener('keydown', e => { if (e.key === 'Escape' && !painel.hidden) fecharPainel(); });
  addEventListener('resize', () => { if (!painel.hidden) { const r = painel.getBoundingClientRect(); moverPainel(r.left, r.top); } });

  // ---------- aba Monitor ----------
  // Risco de problema massivo: quanto a última hora fugiu do esperado da cidade
  // (média por hora das últimas 24h), descontado o ruído normal para o volume dela,
  // com um peso extra quando os últimos 30 min aceleram. É uma estimativa, não uma previsão.
  const monitorEl = document.getElementById('monitor');
  const NO_TOPO = 6;
  const corRisco = p => `color-mix(in srgb, var(--ink) ${Math.round(30 + 70 * Math.min(1, p))}%, transparent)`; // monocromático: mais risco, mais forte

  function calcularRiscos(F, v, filtro = ui.filtro) {
    const aceita = os => filtro === 'todas' || (filtro === 'sc') === (os.problema === 'sem_conexao');
    const jan = CIDADES.map(() => ({ u60: 0, u30: 0, p30: 0 }));
    for (const os of TODAS_OS) {
      const d = agora - os.criadaEm;
      if (d < 0 || d >= 36e5 || !aceita(os)) continue;
      const j = jan[os.cidade]; j.u60++; d < 18e5 ? j.u30++ : j.p30++;
    }
    return CIDADES.map((_, k) => {
      const fechadas = v.cells[k].filter(c => c.kind === 'ok').map(F.val);
      const esp = fechadas.length ? fechadas.reduce((a, b) => a + b, 0) / fechadas.length : 0;
      const { u60, u30, p30 } = jan[k];
      return { k, esp, u60, u30, p30, ...riscoDe(esp, u60, u30, p30) };
    });
  }
  // risco a partir do esperado por hora e das O.S. da última hora (e das duas metades dela)
  function riscoDe(esp, u60, u30, p30) {
    const base = Math.max(esp, 0.5);
    const z = (u60 - base) / Math.sqrt(base);
    const acel = (u30 - p30) / Math.sqrt(Math.max(p30, 1));
    const p = 1 / (1 + Math.exp(-1.3 * (z + 0.5 * Math.max(0, acel) - 3)));
    const tend = acel >= 1.5 ? 'subindo' : acel <= -1.5 ? 'caindo' : 'estável';
    return { p, tend, variacao: esp > 0 ? u60 / esp - 1 : null };
  }
  // filial: soma das cidades (O.S. da última hora contra a soma dos esperados)
  const emAlerta = r => r.p >= 0.5 && r.u60 >= MIN_OS_ALERTA;
  function riscosPorFilial(riscos) {
    return FILIAIS.map(f => {
      const rs = riscos.filter(r => filialDe(r.k) === f), soma = c => rs.reduce((s, r) => s + r[c], 0);
      const esp = soma('esp'), u60 = soma('u60');
      return { f, esp, u60, ...riscoDe(esp, u60, soma('u30'), soma('p30')), cidades: rs, alerta: rs.filter(emAlerta) };
    });
  }
  // Curva cúbica monótona (tangentes pela média harmônica das inclinações): passa por todos os
  // pontos sem ultrapassá-los, então nunca desce abaixo de zero nem inventa picos entre duas horas.
  // Devolve um comando "C ..." do SVG por trecho.
  function curvaMonotona(pts) {
    const n = pts.length, h = pts[1][0] - pts[0][0];
    const d = pts.slice(1).map((p, i) => (p[1] - pts[i][1]) / h);
    const m = pts.map((_, i) => i === 0 ? d[0] : i === n - 1 ? d[n - 2] : d[i - 1] * d[i] > 0 ? 2 * d[i - 1] * d[i] / (d[i - 1] + d[i]) : 0);
    return d.map((_, i) => {
      const [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
      return `C${x0 + h / 3},${y0 + m[i] * h / 3} ${x1 - h / 3},${y1 - m[i + 1] * h / 3} ${x1},${y1}`;
    });
  }
  const tetoBonito = x => { const e = 10 ** Math.floor(Math.log10(x)), m = x / e; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * e; };
  // acima de +100% fica mais legível como múltiplo do esperado (\"13,8× o esperado\" em vez de \"+1280%\")
  const fmtVariacao = v => v === null ? 'sem histórico' : v >= 1 ? `${(v + 1 >= 10 ? nf0 : nf1).format(v + 1)}× o esperado` : `${v > 0 ? '+' : ''}${Math.round(v * 100)}%`;
  const fmtVar = r => fmtVariacao(r.variacao);

  function renderMonitor() {
    const F = FILTRO[ui.filtro], v = view('hora');
    const riscos = calcularRiscos(F, v);
    const topo = riscos.filter(r => ui.filial === 'todas' || filialDe(r.k).id === ui.filial).sort((a, b) => b.p - a.p || b.u60 - a.u60 || b.esp - a.esp).slice(0, NO_TOPO);
    monitorEl.textContent = '';
    if (!CIDADES.length) { monitorEl.innerHTML = '<div class="inc-vazio"><b>Nenhuma O.S. recebida ainda.</b>As cidades aparecem aqui conforme as O.S. de clientes chegam pelo webhook <code>POST /webhook/os</code>.</div>'; return; }

    // risco por filial (clicar filtra o monitor pela filial; clicar de novo volta para todas)
    const s0 = document.createElement('section');
    s0.innerHTML = '<h2 class="mon-titulo"><span>Risco por filial</span><small>soma das cidades de cada filial na última hora</small></h2><div class="ranking filiais"></div>';
    for (const r of riscosPorFilial(riscos)) {
      const b = document.createElement('div'); b.tabIndex = 0; b.setAttribute('role', 'button');
      b.className = 'rk' + (ui.filial === r.f.id ? ' sel' : '');
      b.setAttribute('aria-pressed', String(ui.filial === r.f.id));
      const alertas = r.alerta.length
        ? `<b>${r.alerta.length}</b> de ${r.cidades.length} cidades em alerta`
        : `nenhuma das ${r.cidades.length} cidades em alerta`;
      b.innerHTML = `<div class="rk-top"><span class="rk-pos">${r.f.id}</span><span class="rk-nome"></span></div>
        <div class="rk-risco">${Math.round(r.p * 100)}%<small>de risco</small></div>
        <div class="rk-barra"><i style="width:${Math.max(2, r.p * 100)}%;background:${corRisco(r.p)}"></i></div>
        <div class="rk-linha"><b>${nf0.format(r.u60)}</b> O.S. na última hora · esperado <b>${nf1.format(r.esp)}</b></div>
        <div class="rk-linha">Variação <b>${fmtVariacao(r.variacao)}</b> · ${alertas}</div>
        <button type="button" class="btn-sm ghost rk-inc" data-inc-filial="${r.f.id}"></button>`;
      b.querySelector('.rk-nome').textContent = r.f.nome;
      const alternar = () => { ui.filial = ui.filial === r.f.id ? 'todas' : r.f.id; store.set('filial', ui.filial); render(); };
      b.addEventListener('click', e => { if (!e.target.closest('.rk-inc')) alternar(); });
      b.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target === b) { e.preventDefault(); alternar(); } });
      const btInc = b.querySelector('.rk-inc');
      pintarBotaoPequeno(btInc, estadoChave(chaveFilial(r.f.id)));
      btInc.addEventListener('click', () => gerarIncidenteFilial(r.f.id));
      s0.querySelector('.filiais').appendChild(b);
    }
    if (FILIAIS.length) monitorEl.appendChild(s0); // sem lista de filiais, a seção não aparece

    // ranking
    const s1 = document.createElement('section');
    s1.innerHTML = '<h2 class="mon-titulo"><span>Maior risco de problema massivo agora</span><small>última hora comparada com a média por hora das últimas 24h</small></h2><div class="ranking"></div>';
    topo.forEach((r, i) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'rk';
      b.innerHTML = `<div class="rk-top"><span class="rk-pos">${i + 1}</span><span class="rk-nome"></span></div>
        <div class="rk-risco">${Math.round(r.p * 100)}%<small>de risco</small></div>
        <div class="rk-barra"><i style="width:${Math.max(2, r.p * 100)}%;background:${corRisco(r.p)}"></i></div>
        <div class="rk-linha"><b>${nf0.format(r.u60)}</b> O.S. na última hora · esperado <b>${nf1.format(r.esp)}</b></div>
        <div class="rk-linha">Variação <b>${fmtVar(r)}</b> · ${r.tend}</div>`;
      b.querySelector('.rk-nome').textContent = CIDADES[r.k][0];
      b.querySelector('.rk-pos').textContent = `${i + 1} · ${filialDe(r.k).id}`;
      b.addEventListener('click', () => document.getElementById('gc-' + r.k)?.scrollIntoView({ behavior: 'smooth', block: 'nearest' }));
      s1.querySelector('.ranking').appendChild(b);
    });
    monitorEl.appendChild(s1);

    // gráficos das mesmas cidades
    const s2 = document.createElement('section');
    s2.innerHTML = '<h2 class="mon-titulo"><span>Últimas 24 horas</span><small>O.S. por hora · a última barra é a hora em andamento</small></h2><div class="graficos"></div>';
    for (const r of topo) {
      const horas = v.cells[r.k], vals = horas.map(F.val);
      const max = tetoBonito(Math.max(1, r.esp * 1.3, ...vals));
      const clientes = CIDADES[r.k][2];
      const card = document.createElement('article'); card.className = 'gc'; card.id = 'gc-' + r.k;
      card.innerHTML = `<div class="gc-head"><div><h3></h3><p></p></div><span class="chip"><i style="background:${corRisco(r.p)}"></i><span>${Math.round(r.p * 100)}% de risco</span></span></div>
        <div class="gc-plot" style="grid-template-columns:repeat(${horas.length},1fr)"><span class="gc-max">${nf0.format(max)}</span></div>
        <div class="gc-x" style="grid-template-columns:repeat(${horas.length},1fr)"></div>
        <div class="gc-pe"><div class="gc-leg"></div><button type="button" class="btn-sm ghost">Ver no mapa</button></div>`;
      card.querySelector('h3').textContent = CIDADES[r.k][0];
      card.querySelector('p').textContent = `${rotuloFilial(r.k).replace(/^f/, 'F')} · ` + (clientes ? `${nf0.format(clientes)} clientes · ` : '') + `variação ${fmtVar(r)} na última hora`;
      const plot = card.querySelector('.gc-plot'), eixo = card.querySelector('.gc-x');
      horas.forEach((c, ci) => {
        const b = document.createElement('div');
        b.className = 'b' + (c.kind === 'partial' ? ' agora' : '');
        b.dataset.k = r.k; b.dataset.c = ci;
        const partes = ui.filtro === 'todas' ? [[c.sc, '--c-sc'], [c.len, '--c-len']] : [[F.val(c), ui.filtro === 'sc' ? '--c-sc' : '--c-len']];
        b.innerHTML = partes.filter(([x]) => x > 0).map(([x, cor]) => `<span style="height:${x / max * 100}%;background:var(${cor})"></span>`).join('');
        plot.appendChild(b);
        const rot = document.createElement('span');
        rot.textContent = c.kind === 'partial' ? 'agora' : ci % 6 === 0 ? v.cols[ci].label : '';
        eixo.appendChild(rot);
      });
      // curva suave pelo total de cada hora; o trecho até a hora em andamento é tracejado
      const pts = vals.map((x, i) => [(i + 0.5) / vals.length * 1000, 100 - Math.min(1, x / max) * 100]);
      const segs = curvaMonotona(pts);
      plot.insertAdjacentHTML('beforeend', `<svg class="gc-curva" viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true">
        <path d="M${pts[0]} ${segs.slice(0, -1).join(' ')}"/><path class="parcial" d="M${pts[pts.length - 2]} ${segs[segs.length - 1]}"/></svg>`);
      vals.forEach((x, i) => {
        const p = document.createElement('i');
        p.className = 'gc-pt' + (i === vals.length - 1 ? ' parcial' : '');
        p.style.left = `${(i + 0.5) / vals.length * 100}%`;
        p.style.bottom = `calc(${Math.min(1, x / max)} * (100% - 16px))`;
        plot.appendChild(p);
      });
      const linha = document.createElement('div'); linha.className = 'gc-esp';
      linha.style.bottom = `calc(${Math.min(1, r.esp / max)} * (100% - 16px))`;
      linha.innerHTML = `<span>esperado ${nf1.format(r.esp)}/h</span>`;
      plot.appendChild(linha);
      card.querySelector('.gc-leg').innerHTML = (ui.filtro !== 'len' ? '<span><i style="background:var(--c-sc)"></i>Sem conexão</span>' : '')
        + (ui.filtro !== 'sc' ? '<span><i style="background:var(--c-len)"></i>Lentidão</span>' : '')
        + '<span><i class="curva"></i>Total por hora</span><span><i class="tracejado"></i>Esperado</span>';
      card.querySelector('.btn-sm').addEventListener('click', () => abrirCidadeAgora(r.k));
      s2.querySelector('.graficos').appendChild(card);
    }
    monitorEl.appendChild(s2);
  }

  // hover nas barras dos gráficos usa a mesma caixinha do mapa
  let barraHot = null;
  monitorEl.addEventListener('pointermove', e => {
    const b = e.target.closest('.gc-plot .b');
    if (barraHot && barraHot !== b) barraHot.classList.remove('hot');
    barraHot = b;
    if (!b) { tip.hidden = true; return; }
    b.classList.add('hot');
    const k = +b.dataset.k, c = view('hora').cells[k][+b.dataset.c], F = FILTRO[ui.filtro], v = F.val(c);
    const esp = calcularEsperadoHora(k, F) * c.fracao;
    tip.querySelector('.tip-city').textContent = CIDADES[k][0];
    tip.querySelector('.tip-where').textContent = c.where + (c.kind === 'partial' ? ' · em andamento' : '');
    tip.querySelector('.tip-val i').style.background = corSuave(posicao(v, esp, 'hora'));
    tip.querySelector('.tip-val span').textContent = fmtOS(v);
    const n = nivel(v, esp, 'hora'), desvio = esp > 0 ? Math.round((v / esp - 1) * 100) : null;
    tip.querySelector('.tip-status').textContent = `${NIVEIS[n]}` + (desvio === null ? '' : ` · ${desvio > 0 ? '+' : ''}${desvio}% do esperado (${nf1.format(esp)})`);
    tip.querySelector('[data-k="mix"]').textContent = F.mix(c);
    tip.querySelector('[data-k="base"]').hidden = true;
    tip.hidden = false;
    placeTip(e.clientX, e.clientY);
  });
  monitorEl.addEventListener('pointerleave', () => { barraHot?.classList.remove('hot'); barraHot = null; tip.hidden = true; });
  function calcularEsperadoHora(k, F) {
    const x = view('hora').cells[k].filter(c => c.kind === 'ok').map(F.val);
    return x.length ? x.reduce((a, b) => a + b, 0) / x.length : 0;
  }

  // abre o mapa hora a hora com a janela de detalhes da cidade na hora atual
  // se a cidade estiver fora da filial escolhida, volta para todas as filiais
  function mostrarFilialDa(k) { if (ui.filial !== 'todas' && filialDe(k).id !== ui.filial) { ui.filial = 'todas'; store.set('filial', 'todas'); } }
  function abrirCidadeAgora(k) {
    mostrarFilialDa(k);
    ui.aba = 'mapa'; ui.gran = 'hora'; store.set('aba', 'mapa'); store.set('gran', 'hora'); render();
    const el = cellEls[ordem.indexOf(k)]?.[V.cols.length - 1];
    if (el) { el.scrollIntoView({ block: 'nearest' }); abrirPainel(el); }
  }

  // ---------- toasts de variação anormal ----------
  // Avisa quando o risco de uma cidade passa de 50% (Alto) ou 75% (Crítico), olhando todos os
  // problemas. Uma vez por cidade a cada hora; só avisa de novo se piorar de Alto para Crítico.
  const toastsEl = document.getElementById('toasts');
  const MAX_TOASTS = 4, DURACAO_ALTO = 12000;
  const MIN_OS_ALERTA = 5; // massivo pede volume: 2 ou 3 O.S. numa cidade pequena não viram aviso
  const sessao = {
    get() { try { return JSON.parse(sessionStorage.getItem('termografo.alertas')) || {}; } catch { return {}; } },
    set(v) { try { sessionStorage.setItem('termografo.alertas', JSON.stringify(v)); } catch {} }
  };
  const avisados = sessao.get(); // "cidade|hora" -> nível já avisado

  const MIN_CIDADES_FILIAL = 3; // a partir disso, um aviso só para a filial em vez de um por cidade

  function verificarAlertas() {
    const hora = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate(), hoje.getHours()).getTime();
    for (const k in avisados) if (+k.split('|')[1] < hora - 36e5) delete avisados[k];
    const nivelDe = p => p >= 0.75 ? 3 : 2;
    const riscos = calcularRiscos(FILTRO.todas, view('hora'), 'todas');
    const cobertas = new Set(); // cidades já incluídas num aviso de filial

    // filiais com várias cidades em alerta ao mesmo tempo
    for (const r of riscosPorFilial(riscos)) {
      if (r.alerta.length < MIN_CIDADES_FILIAL) continue;
      r.alerta.forEach(c => cobertas.add(c.k));
      const n = Math.max(nivelDe(r.p), ...r.alerta.map(c => nivelDe(c.p))), chave = `F${r.f.id}|${hora}`;
      if ((avisados[chave] || 0) >= n) continue;
      avisados[chave] = n;
      r.alerta.forEach(c => { avisados[`${c.k}|${hora}`] = Math.max(avisados[`${c.k}|${hora}`] || 0, n); });
      r.alerta.forEach(c => toastsEl.querySelector(`.toast[data-id="c${c.k}"]`)?.remove());
      mostrarToastFilial(r, n);
    }

    // cidades isoladas; o mais grave entra por último e fica no topo da pilha
    for (const r of riscos.filter(r => emAlerta(r) && !cobertas.has(r.k)).sort((a, b) => a.p - b.p)) {
      const n = nivelDe(r.p), chave = `${r.k}|${hora}`;
      if ((avisados[chave] || 0) >= n) continue;
      avisados[chave] = n;
      mostrarToast(r, n);
    }
    sessao.set(avisados);
  }

  function mostrarToast(r, n) {
    const desvio = r.variacao === null ? '' : ` · ${fmtVariacao(r.variacao)}`;
    criarToast({
      id: 'c' + r.k, n,
      titulo: `Variação anormal em ${CIDADES[r.k][0]}`,
      linhas: [`<span class="num">${nf0.format(r.u60)} O.S.</span> na última hora · esperado ${nf1.format(r.esp)}/h${desvio}`,
               `${NIVEIS[n]} · ${Math.round(r.p * 100)}% de risco de problema massivo · ${rotuloFilial(r.k)}`],
      verMapa: () => abrirCidadeAgora(r.k),
      verMonitor: () => {
        mostrarFilialDa(r.k);
        ui.aba = 'monitor'; store.set('aba', 'monitor'); render();
        document.getElementById('gc-' + r.k)?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    });
  }

  function mostrarToastFilial(r, n) {
    const nomes = r.alerta.slice().sort((a, b) => b.u60 - a.u60).map(c => escHtml(CIDADES[c.k][0])); // nomes podem vir do webhook
    const lista = nomes.length > 3 ? `${nomes.slice(0, 3).join(', ')} e mais ${nomes.length - 3}` : nomes.join(', ').replace(/, ([^,]*)$/, ' e $1');
    const desvio = r.variacao === null ? '' : ` · ${fmtVariacao(r.variacao)}`;
    const filtrar = aba => { ui.filial = r.f.id; ui.aba = aba; ui.gran = aba === 'mapa' ? 'hora' : ui.gran; ['filial', 'aba', 'gran'].forEach(c => store.set(c, ui[c])); render(); };
    criarToast({
      id: 'f' + r.f.id, n,
      titulo: `Problema massivo na filial ${r.f.id}`,
      linhas: [`${r.alerta.length} de ${r.cidades.length} cidades em alerta: ${lista}`,
               `<span class="num">${nf0.format(r.u60)} O.S.</span> na última hora · esperado ${nf1.format(r.esp)}/h${desvio}`,
               `${NIVEIS[n]} · ${r.f.nome}`],
      verMapa: () => filtrar('mapa'),
      verMonitor: () => filtrar('monitor'),
      incFilial: r.f.id
    });
  }

  // monta o toast; as linhas chegam como HTML já escapado (nomes passam por escHtml)
  const escHtml = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  function criarToast({ id, n, titulo, linhas, verMapa, verMonitor, incFilial, acoes }) {
    toastsEl.querySelector(`.toast[data-id="${id}"]`)?.remove(); // piorou: o aviso novo substitui o anterior
    const t = document.createElement('div');
    t.className = 'toast'; t.setAttribute('role', 'status'); t.dataset.id = id;
    t.innerHTML = `
      <span class="toast-dot" style="background:${tomNivel(n)}"></span>
      <div class="toast-txt"><b></b>${linhas.map(l => `<span>${l}</span>`).join('')}</div>
      <button type="button" class="fechar" aria-label="Fechar aviso">×</button>
      <div class="toast-acoes"><button type="button" class="btn-sm">Ver no mapa</button><button type="button" class="btn-sm ghost">Ver no monitor</button></div>`;
    if (incFilial) {
      const bt = document.createElement('button'); bt.type = 'button'; bt.className = 'btn-sm ghost'; bt.dataset.incFilial = incFilial;
      pintarBotaoPequeno(bt, estadoChave(chaveFilial(incFilial)));
      bt.addEventListener('click', () => gerarIncidenteFilial(incFilial));
      t.querySelector('.toast-acoes').appendChild(bt);
    }
    t.querySelector('b').textContent = titulo;
    const fechar = () => { if (t.classList.contains('saindo')) return; t.classList.add('saindo'); setTimeout(() => t.remove(), 180); };
    t.querySelector('.fechar').addEventListener('click', fechar);
    if (acoes) {
      const caixa = t.querySelector('.toast-acoes'); caixa.textContent = '';
      acoes.forEach((a, i) => {
        const bt = document.createElement('button'); bt.type = 'button'; bt.className = 'btn-sm' + (i ? ' ghost' : ''); bt.textContent = a.rotulo;
        bt.addEventListener('click', () => { a.fn(); fechar(); });
        caixa.appendChild(bt);
      });
    } else {
      const [btMapa, btMonitor] = t.querySelectorAll('.toast-acoes .btn-sm');
      btMapa.addEventListener('click', () => { verMapa(); fechar(); });
      btMonitor.addEventListener('click', () => { verMonitor(); fechar(); });
    }
    // Alto some sozinho (a barrinha mostra o tempo e pausa com o mouse em cima); Crítico fica até fechar
    if (n < 3) {
      const barra = document.createElement('div'); barra.className = 'toast-tempo';
      barra.style.animationDuration = DURACAO_ALTO + 'ms';
      barra.addEventListener('animationend', fechar);
      t.appendChild(barra);
    }
    toastsEl.prepend(t); // o mais novo fica em cima
    while (toastsEl.children.length > MAX_TOASTS) toastsEl.lastElementChild.remove();
  }

  // ---------- aba Rede: chamados de GPON, Core e IVR ----------
  const redeEl = document.getElementById('rede'), tipG = document.getElementById('tipG');

  // alarmes abertos buscados pela ponte (a cada 5 min ou em "Buscar agora")
  let BUSCA_ALARMES = SERVIDOR?.alarmes || null, avisoAlarmes = '';
  function linhaAlarmes() {
    if (!BUSCA_ALARMES) return '';
    const n = (v, um, varios) => `${v} ${v === 1 ? um : varios}`;
    const st = BUSCA_ALARMES.buscando ? 'Buscando alarmes abertos no monitoramento…'
      : BUSCA_ALARMES.erro ? `A última busca de alarmes falhou: ${escHtml(BUSCA_ALARMES.erro)}`
      : BUSCA_ALARMES.em ? [`Alarmes buscados às ${hhmm(BUSCA_ALARMES.em)}`, n(BUSCA_ALARMES.total, 'aberto', 'abertos'),
          BUSCA_ALARMES.novos && n(BUSCA_ALARMES.novos, 'novo', 'novos'), BUSCA_ALARMES.resolvidos && n(BUSCA_ALARMES.resolvidos, 'resolvido', 'resolvidos'),
          BUSCA_ALARMES.reconhecidos && `${n(BUSCA_ALARMES.reconhecidos, 'já reconhecido', 'já reconhecidos')} (fora)`].filter(Boolean).join(' · ')
      : 'Alarmes abertos ainda não buscados';
    const prox = BUSCA_ALARMES.proximo && !BUSCA_ALARMES.buscando ? ` · próxima às ${hhmm(BUSCA_ALARMES.proximo)}` : '';
    return `<div class="rd-alarmes"><span>${avisoAlarmes ? escHtml(avisoAlarmes) : st + prox}</span>
      <button type="button" class="btn-link" data-buscar-alarmes${BUSCA_ALARMES.buscando ? ' disabled' : ''}>Buscar agora</button></div>`;
  }
  redeEl.addEventListener('click', async ev => {
    const bt = ev.target.closest('[data-buscar-alarmes]');
    if (!bt) return;
    bt.disabled = true; BUSCA_ALARMES = { ...BUSCA_ALARMES, buscando: true }; renderRede();
    try {
      const r = await fetch('api/rede/buscar-alarmes', { method: 'POST' });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.erro || `o servidor respondeu ${r.status}`);

    }
