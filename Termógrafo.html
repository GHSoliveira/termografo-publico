      const vazio = document.createElement('div'); vazio.className = 'inc-vazio';
      const nomeCat = ui.redeCat !== 'todos' ? ` de ${NOME_CAT[ui.redeCat]}` : '';
      vazio.textContent = { novo: `Nenhum chamado novo${nomeCat} para triagem.`, acompanhamento: `Nenhum chamado${nomeCat} em acompanhamento.`, os_aberta: `Nenhum chamado${nomeCat} com O.S. técnica.`, encerrado: `Nenhum chamado${nomeCat} baixado.` }[ui.redeSt] || `Nenhum evento${nomeCat}.`;
      col.appendChild(vazio);
    } else if (ui.redeSt === 'novo') {
      // Na Triagem, divide os chamados em seções claras: GPON, Core e IVR
      const cats = ui.redeCat === 'todos' ? ['gpon', 'core', 'ivr'] : [ui.redeCat];
      for (const cat of cats) {
        const doGrupo = lista.filter(e => categoriaDe(e) === cat);
        if (!doGrupo.length && ui.redeCat === 'todos') continue;
        const sec = document.createElement('div'); sec.className = 'rd-sec';
        sec.innerHTML = `<b>${TITULO_CAT[cat]}</b><span>${doGrupo.length}</span>`;
        col.appendChild(sec);
        for (const e of doGrupo) col.appendChild(itemRede(e));
      }
    } else {
      for (const e of lista) col.appendChild(itemRede(e));
    }
    const det = document.createElement('div'); det.className = 'rd-det';
    redeEl.append(col, det);
    redeEl.classList.toggle('com-detalhe', redeDetalhe);
    const sel = EVENTOS.get(ui.redeSel);
    if (sel && lista.includes(sel)) detalheRede(det, sel); else det.innerHTML = '<div class="inc-vazio">Escolha um chamado na lista.</div>';
    const trocouChamado = vistaAnterior.sel !== null && vistaAnterior.sel !== ui.redeSel;
    if (vistaAnterior.sel !== ui.redeSel) consultarSeVelho(sel); // consulta da PON é sob demanda: ao abrir o chamado
    if (trocouChamado) det.scrollTop = 0; else [col.scrollTop, det.scrollTop] = rolagem;
    if (trocouChamado) suave(det, 4, 220);
    vistaAnterior.sel = ui.redeSel;
  }

  // quantidade em cada fila e em cada divisão da Triagem (GPON, Core, IVR)
  function contarFilas(todos) {
    const n = st => todos.filter(e => e.status === st).length;
    const cont = { novo: n('novo'), acompanhamento: n('acompanhamento') + n('recuperado'), os_aberta: n('os_aberta'), encerrado: n('encerrado'), todos: todos.length };
    document.querySelectorAll('#subrede button').forEach(b => {
      let c = b.querySelector('.cnt');
      if (!c) { c = document.createElement('span'); c.className = 'cnt'; b.appendChild(c); }
      c.textContent = cont[b.dataset.st] || '';
    });
    const emTriagem = todos.filter(e => ui.redeSt === 'todos' || e.status === ui.redeSt || (ui.redeSt === 'acompanhamento' && e.status === 'recuperado'));
    const contCat = {
      todos: emTriagem.length,
      gpon: emTriagem.filter(e => categoriaDe(e) === 'gpon').length,
      core: emTriagem.filter(e => categoriaDe(e) === 'core').length,
      ivr: emTriagem.filter(e => categoriaDe(e) === 'ivr').length
    };
    document.querySelectorAll('#subtriagem button').forEach(b => {
      let c = b.querySelector('.cnt');
      if (!c) { c = document.createElement('span'); c.className = 'cnt'; b.appendChild(c); }
      c.textContent = contCat[b.dataset.cat] || '';
    });
  }

  // margem de incidente (fica no servidor; a página só usa para mostrar ON × margem)
  let margemAtual = SERVIDOR?.margem ?? 75;

  // % de clientes ON no último minuto depois da queda
  function onlineAgora(e) {
    const p = e.serie[e.serie.length - 1];
    if (!p || !e.totalClientes || p.t < e.ocorridoEm) return null;
    return { online: p.online, total: e.totalClientes, pct: p.online / e.totalClientes * 100 };
  }
  const deEnergia = e => (e.semEnergia || 0) > (e.los || 0) + (e.losi || 0) + (e.lofi || 0) + (e.sinalAlto || 0) + (e.tempAlta || 0);

  function itemRede(e) {
    const cat = categoriaDe(e), alarmes = alarmesDe(e);
    const o = lerOLT(e), a = afetadosDe(e) || 1, ativo = eventoAtivo(e), on = onlineAgora(e);
    const quando = ativo ? `Caiu às ${hhmm(e.ocorridoEm)} · ${haQuanto(e.ocorridoEm)}`
      : e.normalizadoEm ? `${dataHora(e.ocorridoEm)} · normalizou após ${duracaoTxt(e.ocorridoEm, e.normalizadoEm)}` : dataHora(e.ocorridoEm);
    const acompanhado = e.status === 'acompanhamento' || e.status === 'recuperado';
    const b = document.createElement('button'); b.type = 'button';
    b.className = 'rd-item' + (e.id === ui.redeSel ? ' sel' : '');
    b.innerHTML = `
      <span class="rd-dot" style="background:${tomNivel(nivelRede(e))}"></span>
      <div class="rd-item-main">
        <div class="rd-olt"></div>
        <div class="rd-sub"></div>
        <div class="rd-sub">${quando}</div>
        ${acompanhado && on ? `<div class="rd-sub rd-on"><b>${nf0.format(on.pct)}% ON</b> agora · margem ${nf0.format(e.margem)}%</div>` : ''}
      </div>
      <div class="rd-num"><b>${semDados(e) ? '…' : nf0.format(afetadosDe(e))}</b><span>afetados</span></div>
      <div class="rd-mix">${alarmes.map(al => e[al.chave] ? `<span style="width:${e[al.chave] / a * 100}%;background:var(${al.cor})" title="${al.nome}: ${nf0.format(e[al.chave])}"></span>` : '').join('')}</div>
      <div class="rd-tags"><span class="pill cat">${NOME_CAT[cat]}</span>${pillSev(e)}<span class="pill st-${e.status}">${STATUS_REDE[e.status] || e.status}</span><span class="rd-causa-curta">${semDados(e)
        ? (e.erroConsulta ? 'consulta falhou' : 'consultando…') : causaProvavel(e).curto}</span></div>`;
    b.querySelector('.rd-olt').textContent = e.olt;
    const onde = o.cidades?.length > 1 ? o.cidades.join(' ↔ ') : (o.cidade || (o.codigo ? `cidade ${o.codigo}` : 'cidade não identificada'));
    b.querySelectorAll('.rd-sub')[0].textContent = [onde, o.local, o.marca, fmtPorta(cat, e.pon)].filter(Boolean).join(' · ');
    b.addEventListener('click', () => { ui.redeSel = e.id; redeDetalhe = true; renderRede(); });
    return b;
  }

  function detalheRede(det, e) {
    const cat = categoriaDe(e), alarmes = alarmesDe(e);
    const o = lerOLT(e), a = afetadosDe(e), c = causaProvavel(e), ativo = eventoAtivo(e), rel = osRelacionadas(e);
    const filial = o.k !== undefined ? rotuloFilial(o.k).replace(/^f/, 'F') : null;
    const onde = o.cidades?.length > 1 ? o.cidades.join(' ↔ ') : (o.cidade || (o.codigo && `cidade ${o.codigo} (código não cadastrado)`));
    const sufixoTotal = cat === 'core' ? 'clientes no backbone' : cat === 'ivr' ? 'clientes na torre (est.)' : 'clientes na PON';
    const chips = [NOME_CAT[cat], onde, filial, o.local, o.marca, fmtPorta(cat, e.pon), e.totalClientes && `${nf0.format(e.totalClientes)} ${sufixoTotal}`].filter(Boolean);
    const tempo = e.normalizadoEm
      ? `Caiu em ${dataHora(e.ocorridoEm)} · o monitoramento normalizou às ${hhmm(e.normalizadoEm)}, depois de ${duracaoTxt(e.ocorridoEm, e.normalizadoEm)}`
      : `Caiu em ${dataHora(e.ocorridoEm)} · ${haQuanto(e.ocorridoEm)}`;
    const semServidor = SERVIDOR ? '' : ' disabled title="Disponível com a página aberta pelo servidor"';
    const ocupado = acao => acaoEmCurso && acaoEmCurso.id === e.id && acaoEmCurso.acao === acao;
    const botao = (acao, rotulo, classe = 'btn-sm ghost') => ocupado(acao)
      ? `<button type="button" class="${classe}" data-state="loading" disabled><span class="spin"></span><span class="tx">${rotulo}</span></button>`
      : `<button type="button" class="${classe}" data-acao="${acao}"${semServidor}>${rotulo}</button>`;
    const animarOS = acaoRecente && acaoRecente.id === e.id && acaoRecente.acao === 'abrir_os';
    acaoRecente = null;
    const os = (classe = 'btn-sm ghost') => e.os
      ? `<span class="rd-os${animarOS ? ' animar' : ''}">${CHECK}<span class="tx">O.S. técnica <b>${escHtml(e.os)}</b> aberta às ${hhmm(e.osAbertaEm)}${OSS.has(e.os) ? ` · ${escHtml(OSS.get(e.os).status)}` : ''}</span>${OSS.has(e.os) ? '<button type="button" class="btn-link" data-ver-inc>Ver em Incidentes</button>' : ''}</span>`
      : botao('abrir_os', 'Abrir O.S. técnica', classe);

    // ações de cada fila
    const acoes = {
      novo: () => deEnergia(e)
        ? [botao('acompanhar', 'Mandar para acompanhamento', 'btn-sm'), os(), botao('baixa', 'Dar baixa')]
        : [os('btn-sm'), botao('acompanhar', 'Mandar para acompanhamento'), botao('baixa', 'Dar baixa')],
      acompanhamento: () => [botao('recuperado', 'Marcar como recuperado'), os(), botao('parar_acompanhamento', 'Voltar para triagem'), botao('baixa', 'Dar baixa')],
      recuperado: () => [botao('baixa', 'Dar baixa', 'btn-sm'), botao('voltar_acompanhamento', 'Voltar para acompanhamento'), os()],
      os_aberta: () => [os(), botao('acompanhar', 'Mandar para acompanhamento'), botao('baixa', 'Dar baixa')],
      encerrado: () => [e.os ? os() : '', botao('reabrir', 'Reabrir')]
    }[e.status] || (() => []);

    const textoConsulta = cat === 'ivr'
      ? `Concentrador / torre sem OLT (sem telemetria óptica de fibra) · monitoramento simplificado${e.ultimaConsulta ? ` · leitura às ${hhmm(e.ultimaConsulta)}` : ''}${e.temperatura ? ` · temp. <b>${nf1.format(e.temperatura)}°C</b>` : ''}`
      : e.pon
        ? (e.ultimaConsulta
          ? `${ROTULO_PORTA[cat]} <b>${escHtml(e.pon)}</b> consultad${cat === 'core' ? 'o' : 'a'} às ${hhmm(e.ultimaConsulta)}:${dd(new Date(e.ultimaConsulta).getSeconds())} em <b>${e.consultaMs ? nf0.format(e.consultaMs) + ' ms' : '< 1 ms'}</b>${ativo || e.status === 'acompanhamento' || e.status === 'recuperado' ? ' · atualiza a cada minuto' : ''}`
          : `<span class="spin"></span> Consultando ${ROTULO_PORTA[cat]} <b>${escHtml(e.pon)}</b> no monitoramento…`)
        : 'Incidente sem porta/enlace informado para consulta.';

    const subAfetados = e.totalClientes
      ? `${pct(a, e.totalClientes)} ${cat === 'core' ? 'do backbone' : cat === 'ivr' ? 'da torre' : 'da PON'}`
      : 'clientes';

    det.innerHTML = `
      <div class="rd-cab">
        <button type="button" class="btn-sm ghost rd-voltar">Voltar</button>
        <div class="rd-cab-txt"><h2></h2><p></p></div>
        <span class="pill cat">${NOME_CAT[cat]}</span>
        <span class="pill st-${e.status}">${STATUS_REDE[e.status] || e.status}</span>
      </div>
      <p class="rd-tempo">${tempo}</p>
      ${e.alarme || e.severidade != null ? `<div class="rd-alarme">${pillSev(e)}<b></b>${(e.tags || []).filter(t => t.valor).map(t => `<span class="rd-tag">${escHtml(t.nome)}: ${escHtml(t.valor)}</span>`).join('')}</div>` : ''}
      <div class="rd-consulta">${textoConsulta}
        ${(e.pon || cat === 'ivr' || cat === 'core') && SERVIDOR?.consulta ? botao('consultar', cat === 'ivr' ? 'Atualizar leitura' : 'Consultar agora') : ''}</div>
      ${e.erroConsulta ? `<p class="rd-erro">A última consulta falhou: ${escHtml(e.erroConsulta)}</p>` : ''}
      ${semDados(e) ? '' : `<dl class="rd-kpis">
        <div class="rd-kpi"><dt><i style="background:${tomNivel(nivelRede(e))}"></i>Afetados</dt><dd>${nf0.format(a)}</dd><small>${subAfetados}</small></div>
        ${alarmes.map(al => {
          const val = e[al.chave] || 0;
          const sub = al.chave === 'tempAlta' && e.temperatura ? `pico ${nf1.format(e.temperatura)}°C · ${pct(val, a)}` : `${pct(val, a)} dos afetados`;
          return `<div class="rd-kpi" title="${al.dica}"><dt><i style="background:var(${al.cor})"></i>${al.nome}</dt><dd>${nf0.format(val)}</dd><small>${sub}</small></div>`;
        }).join('')}
      </dl>
      ${painelDaFila(e, c)}`}
      <div class="rd-acoes">${baixaAberta === e.id ? '' : acoes().join('')}</div>
      ${baixaAberta === e.id ? `<form class="rd-baixa" novalidate>
        <label for="msgBaixa">${MSG_ACAO[formAcao].rotulo} <span>${MSG_ACAO[formAcao].obs || '(obrigatória)'}</span></label>
        ${MSG_ACAO[formAcao].limite
          ? `<input id="msgBaixa" class="rd-nome" maxlength="${MSG_ACAO[formAcao].limite}" autocomplete="name" placeholder="${MSG_ACAO[formAcao].exemplo}">`
          : `<textarea id="msgBaixa" rows="3" maxlength="500" placeholder="${MSG_ACAO[formAcao].exemplo}"></textarea>`}
        <div class="rd-baixa-acoes"><button type="submit" class="btn-sm">${MSG_ACAO[formAcao].confirmar}</button><button type="button" class="btn-sm ghost" data-cancelar>Cancelar</button><small></small></div>
        <p class="rd-erro" hidden></p></form>` : ''}
      ${erroAcao && erroAcao.id === e.id ? '<p class="rd-erro rd-erro-acao"></p>' : ''}
      ${semDados(e) ? '' : `<section class="rd-graf"><h3>${cat === 'ivr' ? 'Clientes conectados na torre (estimado)' : cat === 'core' ? 'Clientes ativos no backbone' : 'Clientes online'}</h3><div class="gt" data-g="online"></div></section>
      <section class="rd-graf"><h3>${cat === 'ivr' ? 'Condições na torre / concentrador' : 'Alarmes por tipo'}</h3><div class="gc-leg rd-leg">${alarmes.map(al => `<span><i style="background:var(${al.cor})"></i>${al.nome}</span>`).join('')}</div><div class="gt" data-g="alarmes"></div></section>`}
      ${cat !== 'ivr' && e.serie.some(p => p.rx) ? `<section class="rd-graf"><h3>${cat === 'core' ? 'Sinal óptico do enlace (dBm)' : 'Sinal óptico médio (dBm)'}</h3><div class="gt" data-g="rx"></div></section>` : ''}
      ${cat === 'ivr' && e.serie.some(p => p.temperatura) ? '<section class="rd-graf"><h3>Temperatura do concentrador (°C)</h3><div class="gt" data-g="temp"></div></section>' : ''}
      <section class="rd-bloco"><h3>Clientes que abriram O.S.</h3><div class="rd-rel"></div></section>
      <section class="rd-bloco"><h3>Histórico</h3><ol class="rd-hist">${e.historico.slice().sort((x, y) => x.em - y.em).map(h =>
        `<li><span>${dataHora(h.em)}</span>${escHtml((HISTORICO[h.acao] || (() => h.acao))(h.detalhe || ''))}</li>`).join('')}</ol></section>`;

    det.querySelector('h2').textContent = e.olt;
    det.querySelector('.rd-cab-txt p').textContent = chips.join(' · ');
    const alarmeEl = det.querySelector('.rd-alarme b'); if (alarmeEl) alarmeEl.textContent = e.alarme || '';
    if (erroAcao && erroAcao.id === e.id) { det.querySelector('.rd-erro-acao').textContent = erroAcao.msg; erroAcao = null; }
    det.querySelector('.rd-voltar').addEventListener('click', () => { redeDetalhe = false; renderRede(); });
    det.querySelectorAll('[data-acao]').forEach(bt => bt.addEventListener('click', () => {
      const comMsg = { baixa: 'encerrar', acompanhar: 'acompanhar' }[bt.dataset.acao];
      if (comMsg) { // ações que pedem mensagem abrem o campo de texto
        if (formAcao !== comMsg) rascunhoBaixa = '';
        baixaAberta = e.id; formAcao = comMsg; renderRede(); suave(redeEl.querySelector('.rd-baixa'), 4, 220); return;
      }
      if (bt.dataset.acao === 'abrir_os') { abrirJanelaOS(e); return; }
      acaoRede(e, bt.dataset.acao);
    }));
    const form = det.querySelector('.rd-baixa');
    if (form) {
      const txt = form.querySelector('#msgBaixa'), cont = form.querySelector('small'), erro = form.querySelector('.rd-erro');
      const contar = () => { cont.textContent = `${txt.value.length}/${MSG_ACAO[formAcao].limite || 500}`; };
      txt.value = rascunhoBaixa; contar();
      txt.addEventListener('input', () => { rascunhoBaixa = txt.value; erro.hidden = true; contar(); });
      txt.addEventListener('keydown', ev => { if (ev.key === 'Escape') form.querySelector('[data-cancelar]').click(); });
      form.querySelector('[data-cancelar]').addEventListener('click', () => { baixaAberta = null; renderRede(); });
      form.addEventListener('submit', ev => {
        ev.preventDefault();
        const msg = txt.value.trim();
        if (!msg) { erro.textContent = MSG_ACAO[formAcao].vazio; erro.hidden = false; txt.focus(); return; }
        baixaAberta = null;
        acaoRede(e, formAcao, msg);
      });
      setTimeout(() => txt.focus());
    }

    det.querySelector('[data-ver-inc]')?.addEventListener('click', () => abrirOSNosIncidentes(e.os));

    // O.S. de clientes ligadas ao evento
    const relEl = det.querySelector('.rd-rel');
    if (!rel) relEl.innerHTML = '<p class="rd-sub">Cidade não identificada: informe "cidade" no webhook ou use o código padrão da cidade no nome do ativo.</p>';
    else {
      const vezes = rel.esp > 0 ? rel.n / rel.esp : null;
      relEl.innerHTML = `<p class="rd-rel-txt"><b>${nf0.format(rel.n)}</b> O.S. de clientes em <span class="rd-cid"></span> desde a queda
        <span class="rd-sub">· esperado ~${nf1.format(rel.esp)} no mesmo período${vezes !== null && vezes >= 2 ? ` · ${nf0.format(vezes)}× o normal` : ''}</span></p>
        <button type="button" class="btn-sm ghost">Ver no mapa</button>`;
      relEl.querySelector('.rd-cid').textContent = rel.cidade;
      relEl.querySelector('button').addEventListener('click', () => abrirCidadeAgora(rel.k));
      if (rel.clientes.length) relEl.appendChild(listaClientesIncidente({ id: 'rede-' + e.id, clientes: rel.clientes }));
    }
    desenharGraficos(det, e);
  }

  // o que cada equipe precisa ver para decidir
  function painelDaFila(e, c) {
    const cat = categoriaDe(e);
    if (e.status === 'novo') {
      if (cat === 'ivr') {
        const energia = e.semEnergia || 0, sinal = e.sinalAlto || 0, temp = (e.tempAlta || 0) + (e.los || 0);
        const tot = energia + sinal + temp || 1;
        return `<div class="rd-causa"><span class="rd-rotulo">Triagem IVR · equipe 1</span>
          <div class="rd-split"><span style="width:${energia / tot * 100}%;background:var(--a-energia)"></span><span style="width:${sinal / tot * 100}%;background:var(--a-losi)"></span><span style="width:${temp / tot * 100}%;background:var(--a-los)"></span></div>
          <div class="rd-split-leg">
            <span><i style="background:var(--a-energia)"></i>Sem energia <b>${pct(energia, tot)}</b></span>
            <span><i style="background:var(--a-losi)"></i>Sinal alto / ruído <b>${pct(sinal, tot)}</b></span>
            <span><i style="background:var(--a-los)"></i>Temp. alta / s/ resp. <b>${pct(temp, tot)}</b>${e.temperatura ? ` (${nf1.format(e.temperatura)}°C)` : ''}</span>
          </div>
          <b>${deEnergia(e) ? 'Falta de energia na torre: mandar para acompanhamento' : `${c.titulo}: abrir O.S. técnica`}</b>
          <p>${deEnergia(e)
            ? 'Queda associada à falta de energia na torre/concentrador. O chamado vai para a equipe 2 acompanhar o retorno.'
            : c.texto}</p></div>`;
      }
      const energia = e.semEnergia || 0, outros = (e.los || 0) + (e.losi || 0) + (e.lofi || 0), tot = energia + outros || 1;
      const rotOutros = cat === 'core' ? 'Link Down / Atenuação / Erros' : 'LOS + LOSi + LOFi';
      return `<div class="rd-causa"><span class="rd-rotulo">Triagem ${NOME_CAT[cat]} · equipe 1</span>
        <div class="rd-split"><span style="width:${energia / tot * 100}%;background:var(--a-energia)"></span><span style="width:${outros / tot * 100}%;background:var(--a-los)"></span></div>
        <div class="rd-split-leg"><span><i style="background:var(--a-energia)"></i>Sem energia <b>${pct(energia, tot)}</b></span><span><i style="background:var(--a-los)"></i>${rotOutros} <b>${pct(outros, tot)}</b></span></div>
        <b>${deEnergia(e) ? 'Problema de energia: mandar para acompanhamento' : `${c.titulo}: abrir O.S. técnica`}</b>
        <p>${deEnergia(e)
          ? 'A maioria dos afetados indica falta de energia. Não é rompimento físico: o chamado vai para a equipe 2 acompanhar a volta.'
          : c.texto}</p></div>`;
    }
    if (e.status === 'acompanhamento' || e.status === 'recuperado') { // equipe 2: ON agora × margem
      const on = onlineAgora(e), m = e.margem || margemAtual;
      const envio = e.historico.filter(h => h.acao === 'acompanhar' && h.detalhe).pop();
      const caixaEnvio = envio ? `<div class="rd-causa"><span class="rd-rotulo">Mandado para acompanhamento · ${dataHora(envio.em)}</span><p class="rd-msg-baixa">${escHtml(envio.detalhe)}</p></div>` : '';
      if (!on) return caixaEnvio + '<div class="rd-causa"><span class="rd-rotulo">Acompanhamento · equipe 2</span><p>Aguardando leitura do monitoramento para acompanhar a volta dos clientes.</p></div>';
      const acima = on.pct > m, precisa = Math.floor(on.total * m / 100) + 1, faltam = Math.max(0, precisa - on.online);
      return caixaEnvio + `<div class="rd-causa rd-recup"><span class="rd-rotulo">Acompanhamento · equipe 2</span>
        <b>${e.status === 'recuperado' ? `Recuperado: ${nf0.format(on.pct)}% ON, acima da margem de ${nf0.format(m)}%` : `Abaixo da margem: ${nf0.format(on.pct)}% ON (margem ${nf0.format(m)}%)`}</b>
        <div class="rd-medidor" title="${nf0.format(on.pct)}% ON · margem ${nf0.format(m)}%"><span style="width:${Math.min(100, on.pct)}%;background:${acima ? 'var(--st-ok)' : 'var(--st-atencao)'}"></span><i style="left:${m}%"></i></div>
        <p>${nf0.format(on.online)} de ${nf0.format(on.total)} clientes ON agora${faltam ? ` · faltam ${nf0.format(faltam)} para passar da margem` : ''}${e.recuperadoEm ? ` · recuperado às ${hhmm(e.recuperadoEm)}` : ''}</p>
        <p class="rd-sub">${e.autoPausado
          ? `Status ajustado manualmente: a mudança automática está pausada. <button type="button" class="btn-link" data-acao="retomar_auto">Retomar automático</button>`
          : 'Muda sozinho para "Recuperado" quando passa da margem. Se estiver errado, ajuste o status abaixo.'}</p></div>`;
    }
    const baixa = e.status === 'encerrado' && e.historico.filter(h => h.acao === 'encerrar' || h.acao === 'encerrar_os').pop();
    const caixaBaixa = baixa ? `<div class="rd-causa"><span class="rd-rotulo">${baixa.acao === 'encerrar_os' ? 'Incidente encerrado' : 'Baixa'} · ${dataHora(baixa.em)}</span><p class="rd-msg-baixa">${escHtml(baixa.detalhe || 'sem mensagem (baixa anterior à regra)')}</p></div>` : '';
    return caixaBaixa + `<div class="rd-causa"><span class="rd-rotulo">Provável causa</span><b>${c.titulo}</b><p>${c.texto}</p><p class="rd-sug"><b>Sugestão:</b> ${c.sugestao}</p></div>`;
  }

  function desenharGraficos(det, e) {
    const pontos = e.serie, alarmes = alarmesDe(e);
    if (!det.querySelector('.gt')) return;
    if (pontos.length < 2) { det.querySelectorAll('.gt').forEach(g => { g.innerHTML = '<p class="rd-sub">Ainda sem pontos suficientes para o gráfico.</p>'; }); return; }
    const marcos = [{ t: e.ocorridoEm, rotulo: 'queda', tipo: 'queda' }];
    if (e.normalizadoEm) marcos.push({ t: e.normalizadoEm, rotulo: 'normalizou', tipo: 'volta' });
    const g = nome => det.querySelector(`.gt[data-g="${nome}"]`);
    const referencia = e.totalClientes && e.margem ? { valor: e.totalClientes * e.margem / 100, rotulo: `margem ${nf0.format(e.margem)}% ON` } : null;
    if (g('online')) graficoTempo(g('online'), pontos, [{ chave: 'online', nome: 'Online', cor: '--ink', area: true }], { marcos, referencia });
    if (g('alarmes')) graficoTempo(g('alarmes'), pontos, alarmes.map(al => ({ chave: al.chave, nome: al.nome, cor: al.cor, traco: al.traco })), { marcos });
    if (g('rx')) graficoTempo(g('rx'), pontos.filter(p => p.rx), [{ chave: 'rx', nome: 'Sinal', cor: '--c-len', unidade: ' dBm' }], { marcos, dbm: true, altura: 140 });
    if (g('temp')) graficoTempo(g('temp'), pontos.filter(p => p.temperatura), [{ chave: 'temperatura', nome: 'Temperatura', cor: '--a-los', unidade: ' °C' }], {
      marcos, dbm: true, altura: 140, referencia: { valor: 70, rotulo: 'alerta 70°C' }
    });
  }

  // gráfico de linhas no tempo: área "depois da queda" sombreada, marcos tracejados e mira com valores no hover
  function graficoTempo(box, pontos, series, { marcos = [], dbm = false, altura = 170, referencia = null } = {}) {
    if (pontos.length < 2) return;
    const W = Math.max(280, Math.floor(box.clientWidth)), H = altura, m = { l: 42, r: 10, t: 16, b: 22 };
    // pelo menos 10 min depois da queda no eixo, para o "depois" aparecer mesmo logo após o evento
    const quedaT = marcos.find(x => x.tipo === 'queda')?.t;
    const t0 = pontos[0].t, t1 = Math.max(pontos[pontos.length - 1].t, t0 + 6e4, quedaT ? quedaT + 10 * 6e4 : 0);
    const valores = pontos.flatMap(p => series.map(s => p[s.chave])).filter(v => Number.isFinite(v));
    let y0 = 0, y1 = tetoBonito(Math.max(1, ...valores, referencia ? referencia.valor : 0));
    if (dbm) { y0 = Math.floor(Math.min(...valores) - 1); y1 = Math.ceil(Math.max(...valores) + 1); }
    const X = t => m.l + (t - t0) / (t1 - t0) * (W - m.l - m.r);
    const Y = v => m.t + (1 - (v - y0) / (y1 - y0)) * (H - m.t - m.b);
    const passo = [5, 15, 30, 60, 120, 240].map(x => x * 6e4).find(p => (t1 - t0) / p <= 7) || 48e4 * 60;
    let s = `<svg class="gt-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">`;
    const queda = marcos.find(x => x.tipo === 'queda');
    if (queda && queda.t < t1) { const x = Math.max(m.l, X(queda.t)); s += `<rect class="gt-depois" x="${x}" y="${m.t}" width="${W - m.r - x}" height="${H - m.t - m.b}"/>`; }
    for (let i = 0; i <= 4; i++) {
      const v = y0 + (y1 - y0) * i / 4, y = Y(v);
      s += `<line class="gt-grade" x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}"/><text class="gt-eixo" x="${m.l - 6}" y="${y + 3.5}" text-anchor="end">${nf0.format(v)}</text>`;
    }
    for (let t = Math.ceil(t0 / passo) * passo; t <= t1; t += passo) s += `<text class="gt-eixo" x="${X(t)}" y="${H - 6}" text-anchor="middle">${hhmm(t)}</text>`;
    if (referencia) {
      const y = Y(referencia.valor);
      s += `<line class="gt-ref" x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}"/><text class="gt-ref-rot" x="${m.l + 6}" y="${y - 5}">${referencia.rotulo}</text>`;
    }
    for (const mk of marcos) {
      if (mk.t < t0 || mk.t > t1) continue;
      const x = X(mk.t);
      const naBorda = x > W - m.r - 70; // rótulo vira para dentro perto da borda direita
      s += `<line class="gt-marco ${mk.tipo}" x1="${x}" x2="${x}" y1="${m.t - 4}" y2="${H - m.b}"/><text class="gt-marco-rot" x="${naBorda ? x - 5 : x + 5}" y="${m.t + 6}" text-anchor="${naBorda ? 'end' : 'start'}">${mk.rotulo}</text>`;
    }
    for (const sr of series) {
      const d = pontos.map((p, i) => `${i ? 'L' : 'M'}${X(p.t).toFixed(1)},${Y(p[sr.chave]).toFixed(1)}`).join('');
      if (sr.area) s += `<path d="${d}L${X(pontos[pontos.length - 1].t).toFixed(1)},${Y(y0)}L${X(pontos[0].t).toFixed(1)},${Y(y0)}Z" style="fill:var(${sr.cor});opacity:.08"/>`;
      s += `<path class="gt-linha" d="${d}" style="stroke:var(${sr.cor})${sr.traco ? `;stroke-dasharray:${sr.traco}` : ''}"/>`;
    }
    s += `<line class="gt-mira" y1="${m.t}" y2="${H - m.b}" visibility="hidden"/><g class="gt-pts"></g><rect class="gt-alvo" x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H - m.b}"/></svg>`;
    box.innerHTML = s;
    const mira = box.querySelector('.gt-mira'), pts = box.querySelector('.gt-pts'), alvo = box.querySelector('.gt-alvo');
    const fase = t => t < pontos[0].t ? '' : queda && t < queda.t ? 'antes da queda' : marcos.find(x => x.tipo === 'volta' && t >= x.t) ? 'depois de normalizar' : 'durante a queda';
    alvo.addEventListener('pointermove', ev => {
      const r = box.querySelector('svg').getBoundingClientRect(), t = t0 + (ev.clientX - r.left - m.l) / (W - m.l - m.r) * (t1 - t0);
      let i = 0;
      for (let j = 1; j < pontos.length; j++) if (Math.abs(pontos[j].t - t) < Math.abs(pontos[i].t - t)) i = j;
      const p = pontos[i], px = X(p.t);
      mira.setAttribute('x1', px); mira.setAttribute('x2', px); mira.setAttribute('visibility', 'visible');
      pts.innerHTML = series.map(sr => `<circle cx="${px}" cy="${Y(p[sr.chave])}" r="4" style="fill:var(${sr.cor})"/>`).join('');
      tipG.innerHTML = `<div class="tip-city">${hhmm(p.t)}</div><div class="tip-where">${fase(p.t)}</div>` + series.map(sr =>
        `<div class="tg-linha"><i style="background:var(${sr.cor})"></i>${sr.nome}<b>${dbm ? nf1.format(p[sr.chave]) : nf0.format(p[sr.chave])}${sr.unidade || ''}</b></div>`).join('');
      tipG.hidden = false;
      const w = tipG.offsetWidth, h = tipG.offsetHeight;
      let left = ev.clientX + 14, top = ev.clientY + 14;
      if (left + w > innerWidth - 8) left = ev.clientX - w - 14;
      if (top + h > innerHeight - 8) top = ev.clientY - h - 14;
      tipG.style.left = Math.max(8, left) + 'px'; tipG.style.top = Math.max(8, top) + 'px';
    });
    alvo.addEventListener('pointerleave', () => { mira.setAttribute('visibility', 'hidden'); pts.innerHTML = ''; tipG.hidden = true; });
  }
  // gráficos têm largura em pixels: redesenha quando a área muda de tamanho
  let redeLargura = 0;
  new ResizeObserver(() => {
    const det = redeEl.querySelector('.rd-det'), e = EVENTOS.get(ui.redeSel);
    if (!det || !e || ui.aba !== 'rede' || det.clientWidth === redeLargura) return;
    redeLargura = det.clientWidth;
    desenharGraficos(det, e);
  }).observe(redeEl);

  // ---------- O.S. técnica e comunicado de incidente ----------
  // A O.S. sai de um formulário com os campos do comunicado; chamados do mesmo equipamento ainda sem
  // O.S. entram juntos. O texto do comunicado é montado aqui (textoComunicado).
  const OSS = new Map(); // número da O.S. -> O.S.
  (SERVIDOR?.oss || []).forEach(o => OSS.set(o.numero, o));
  const TIPOS_INCIDENTE = [
    { id: 'acesso_baixa', nome: 'REDE DE ACESSO - BAIXA', rotulo: 'Rede de acesso · baixa', prazo: 8, cats: ['gpon'] },
    { id: 'acesso_media', nome: 'REDE DE ACESSO - MÉDIA', rotulo: 'Rede de acesso · média', prazo: 6, cats: ['gpon'] },
    { id: 'acesso_alta', nome: 'REDE DE ACESSO - ALTA', rotulo: 'Rede de acesso · alta', prazo: 8, cats: ['gpon'] },
    { id: 'pop_radio', nome: 'POP RÁDIO', rotulo: 'POP rádio', prazo: 8, cats: ['gpon', 'ivr'] },
    { id: 'backbone_rompimento', nome: 'BACKBONE - ROMPIMENTO ÓPTICO', rotulo: 'Backbone · rompimento óptico', prazo: 4, cats: ['core'] },
    { id: 'backbone_degradacao', nome: 'BACKBONE - DEGRADAÇÃO / ATENUAÇÃO', rotulo: 'Backbone · degradação / atenuação', prazo: 6, cats: ['core'] },
    { id: 'backbone_energia', nome: 'BACKBONE - ENERGIA POP', rotulo: 'Backbone · energia POP', prazo: 6, cats: ['core'] },
    { id: 'core_equipamento', nome: 'CORE - ATIVO DE REDE', rotulo: 'Core · ativo de rede', prazo: 4, cats: ['core'] },
    { id: 'ivr_sinal', nome: 'IVR - SINAL ALTO / INTERFERÊNCIA', rotulo: 'IVR · sinal alto / interferência', prazo: 8, cats: ['ivr'] },
    { id: 'ivr_temperatura', nome: 'IVR - TEMPERATURA ALTA', rotulo: 'IVR · temperatura alta', prazo: 6, cats: ['ivr'] },
    { id: 'ivr_energia', nome: 'IVR - SEM ENERGIA NA TORRE', rotulo: 'IVR · sem energia na torre', prazo: 8, cats: ['ivr'] }
  ];
  const tiposPorCat = cat => TIPOS_INCIDENTE.filter(t => t.cats.includes(cat));
  const ACESSO_MEDIA = 30, ACESSO_ALTA = 100; // clientes afetados a partir dos quais a rede de acesso é média / alta
  function tipoSugerido(n, e) {
    const cat = categoriaDe(e);
    if (cat === 'core') {
      if (deEnergia(e)) return 'backbone_energia';
      if ((e?.losi || 0) + (e?.lofi || 0) > (e?.los || 0)) return 'backbone_degradacao';
      return 'backbone_rompimento';
    }
    if (cat === 'ivr') {
      if (deEnergia(e)) return 'ivr_energia';
      if ((e?.tempAlta || 0) > (e?.sinalAlto || 0) || (e?.temperatura && e.temperatura >= 70)) return 'ivr_temperatura';
      if ((e?.sinalAlto || 0) > 0) return 'ivr_sinal';
      return 'pop_radio';
    }
    return n > ACESSO_ALTA ? 'acesso_alta' : n > ACESSO_MEDIA ? 'acesso_media' : 'acesso_baixa';
  }
  const nomeTipo = id => TIPOS_INCIDENTE.find(t => t.id === id)?.nome || id;
  const STATUS_OS = ['SUPERVISOR INFORMADO', 'TÉCNICO ACIONADO', 'EQUIPE EM DESLOCAMENTO', 'EM ATENDIMENTO', 'AGUARDANDO MATERIAL', 'NORMALIZADO'];
  const RESPONSAVEIS_INICIAIS = []; // nomes digitados ao abrir O.S. passam a aparecer na lista
  const dataComunicado = ms => { const d = new Date(ms); return `${hhmm(ms)} ${dd(d.getDate())}-${dd(d.getMonth() + 1)}-${d.getFullYear()}`; };
  const paraLocal = ms => { const d = new Date(ms); return `${d.getFullYear()}-${dd(d.getMonth() + 1)}-${dd(d.getDate())}T${hhmm(ms)}`; };

  function textoComunicado(o) {
    const cat = categoriaDe(o);
    const cab = cat === 'core' ? '🚨 COMUNICADO DE INCIDENTE - REDE CORE / BACKBONE 🚨'
      : cat === 'ivr' ? '🚨 COMUNICADO DE INCIDENTE - REDE IVR (TORRE / CONCENTRADOR) 🚨'
      : '🚨 COMUNICADO DE INCIDENTE - REDE GPON 🚨';
    const rotEq = cat === 'core' ? 'EQUIPAMENTO CORE' : cat === 'ivr' ? 'CONCENTRADOR / TORRE' : 'OLT';
    const rotPortas = cat === 'core' ? 'ENLACES AFETADOS' : cat === 'ivr' ? 'SETORES AFETADOS' : 'PORTAS AFETADAS';
    return [
      cab,
      `ID: ${o.id ?? '(gerado ao abrir)'}`,
      `CIDADES AFETADAS: ${o.cidades.join(' / ') || '—'}`,
      `${rotEq}: ${o.olt}`,
      `${rotPortas}: ${o.portas.join(', ') || '—'}`,
      `INCIDENTE: ${nomeTipo(o.tipo)}`,
      `DESCRIÇÃO: ${o.descricao.trim() || '—'}`,
      `INÍCIO: ${dataComunicado(o.inicio)}`,
      `PREVISÃO: ${o.previsao ? dataComunicado(o.previsao) : '—'}`,
      ...(o.fim ? [`FIM: ${dataComunicado(o.fim)}`] : []),
      `CLIENTES AFETADOS: ${o.clientes}`,
      `RESPONSÁVEL: ${o.responsavel.trim().toUpperCase() || '—'}`,
      `ORDEM DE SERVIÇO: ${o.numero || '(gerada ao abrir)'}`,
      `STATUS ATUAL: ${o.status || 'SUPERVISOR INFORMADO'}`,
      ...(o.mensagemFim ? [`ENCERRAMENTO: ${o.mensagemFim}`] : [])
    ].join('\n');
  }
  function descricaoSugerida(e) {
    const cat = categoriaDe(e);
    if (cat === 'core') {
      if (deEnergia(e)) return 'POP / repetidora sem energia elétrica, equipe de infraestrutura acionada';
      if ((e.losi || 0) + (e.lofi || 0) > (e.los || 0)) return 'Degradação óptica / atenuação no enlace de backbone, equipe de transporte acionada';
      return 'Rompimento de enlace óptico no backbone, equipe de fusão e infraestrutura acionada';
    }
    if (cat === 'ivr') {
      if (deEnergia(e)) return 'Torre / concentrador sem energia elétrica, encaminhado para o supervisor regional';
      if ((e.tempAlta || 0) > (e.sinalAlto || 0) || (e.temperatura && e.temperatura >= 70)) return 'Temperatura alta no concentrador da torre, equipe técnica acionada para vistoria';
      return 'Clientes com sinal alto / degradação no setor da torre, encaminhado para o supervisor regional';
    }
    return deEnergia(e) ? 'Clientes sem energia, encaminhado para o supervisor regional'
      : e.losi + e.lofi > e.los ? 'Clientes com sinal degradado (LOSi/LOFi), encaminhado para o supervisor regional'
      : 'Clientes em LOS, encaminhado para o supervisor regional';
  }
  // outras portas/enlaces/setores do mesmo equipamento ainda sem O.S.: entram juntas na mesma O.S.
  const mesmaOLT = e => [...EVENTOS.values()].filter(x => x.id !== e.id && x.olt === e.olt && !x.os && x.status !== 'encerrado');

  // ---------- janela de abertura do chamado técnico ----------
  // Um <dialog> próprio, fora da área da aba Rede, para as atualizações ao vivo não mexerem nele.
  let osForm = null; // estado da janela enquanto aberta
  const janelaOS = document.createElement('dialog');
  janelaOS.className = 'jo';
  janelaOS.setAttribute('aria-labelledby', 'joTitulo');
  document.body.appendChild(janelaOS);
  janelaOS.addEventListener('close', () => { osForm = null; janelaOS.textContent = ''; });
  janelaOS.addEventListener('cancel', ev => { if (osForm?.enviando) ev.preventDefault(); });
  janelaOS.addEventListener('mousedown', ev => { if (ev.target === janelaOS) fecharJanelaOS(); }); // clique no fundo
  function fecharJanelaOS() {
    if (osForm?.enviando || !janelaOS.open) return;
    if (semMovimentoUI || !janelaOS.animate) { janelaOS.close(); return; }
    // fecha no fim da animação; o prazo garante o fechamento mesmo sem quadros (aba em segundo plano)
    const fechar = () => { clearTimeout(prazo); if (janelaOS.open) janelaOS.close(); };
    const prazo = setTimeout(fechar, 260);
    janelaOS.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(8px) scale(.98)' }], { duration: 160, easing: 'cubic-bezier(.4, 0, 1, 1)' })
      .onfinish = fechar;
  }

  function abrirJanelaOS(e) {
    const irmaos = mesmaOLT(e), o = lerOLT(e);
    const clientes = [e, ...irmaos].reduce((s, x) => s + afetadosDe(x), 0), tipo = tipoSugerido(clientes, e);
    const cidadesIniciais = o.cidades?.length ? [...new Set(o.cidades)] : o.cidade ? [o.cidade] : [];
    osForm = {
      evento: e.id, categoria: categoriaDe(e), cidades: cidadesIniciais, eventos: new Set([e.id, ...irmaos.map(x => x.id)]),
      tipo, tipoManual: false, previsao: Date.now() + prazoDe(tipo) * 36e5, previsaoManual: false,
      descricao: descricaoSugerida(e), responsavel: '', enviando: false, aberta: null
    };
    montarJanelaOS(e);
    janelaOS.showModal();
    janelaOS.querySelector('#joResp')?.focus();
  }
  const prazoDe = tipo => TIPOS_INCIDENTE.find(t => t.id === tipo)?.prazo || 8;
  // os campos do comunicado a partir do que está preenchido na janela
  function osDoForm(e) {
    const evs = [...osForm.eventos].map(id => EVENTOS.get(id)).filter(Boolean);
    return { categoria: categoriaDe(e), olt: e.olt, cidades: osForm.cidades, portas: evs.map(x => x.pon).filter(Boolean).sort(), tipo: osForm.tipo, descricao: osForm.descricao,
      inicio: Math.min(...evs.map(x => x.ocorridoEm)), previsao: osForm.previsao, clientes: evs.reduce((s, x) => s + afetadosDe(x), 0), responsavel: osForm.responsavel };
  }
  const mixHtml = x => { const a = afetadosDe(x) || 1; return `<span class="jo-mix">${alarmesDe(x).map(al => x[al.chave] ? `<span style="width:${x[al.chave] / a * 100}%;background:var(${al.cor})"></span>` : '').join('')}</span>`; };

  function montarJanelaOS(e) {
    if (osForm.aberta) return montarSucessoOS(e, osForm.aberta);
    const cat = categoriaDe(e), o = lerOLT(e), irmaos = mesmaOLT(e);
    const tipos = tiposPorCat(cat);
    const sugerido = tipoSugerido([e, ...irmaos].filter(x => osForm.eventos.has(x.id)).reduce((s, x) => s + afetadosDe(x), 0), e);
    const responsaveis = [...new Set([...[...OSS.values()].map(x => x.responsavel), ...RESPONSAVEIS_INICIAIS])].filter(Boolean);
    const cidades = CIDADES.map(c => c[0]).sort((a, b) => a.localeCompare(b, 'pt-BR'));
    const porta = (x, este) => `<label class="jo-porta">
        <input type="checkbox"${este ? ' checked disabled' : ` data-ev="${escHtml(x.id)}"${osForm.eventos.has(x.id) ? ' checked' : ''}`}>
        <span class="jo-porta-pon">${escHtml(fmtPorta(cat, x.pon) || 'Geral')}</span>
        <span class="jo-porta-info">${este ? 'este chamado' : STATUS_REDE[x.status]} · <b>${nf0.format(afetadosDe(x))}</b> afetados</span>
        ${mixHtml(x)}</label>`;
    const sugestoes = cat === 'core'
      ? ['Rompimento de enlace óptico no backbone, equipe de fusão e infraestrutura acionada',
         'Degradação óptica / atenuação no enlace de backbone, equipe de transporte acionada',
         'POP / repetidora sem energia elétrica, equipe de infraestrutura acionada',
         'Falha em ativo de rede Core, engenharia de rede acionada']
      : cat === 'ivr'
      ? ['Clientes com sinal alto / degradação no setor da torre, encaminhado para o supervisor regional',
         'Temperatura alta no concentrador da torre, equipe técnica acionada para vistoria',
         'Torre / concentrador sem energia elétrica, encaminhado para o supervisor regional',
         'Oscilação no concentrador IVR da torre, equipe de campo acionada']
      : ['Clientes em LOS, encaminhado para o supervisor regional',
         'Clientes sem energia, encaminhado para o supervisor regional',
         'Clientes com sinal degradado (LOSi/LOFi), encaminhado para o supervisor regional',
         'Rompimento de fibra, equipe de campo acionada'];
    const tituloPortas = cat === 'core' ? 'Enlaces afetados' : cat === 'ivr' ? 'Setores / concentradores afetados' : 'Portas afetadas';
    const pluralPortas = ROTULO_PORTAS_PLURAL[cat] || 'portas';

    janelaOS.innerHTML = `<form class="jo-caixa" novalidate>
      <header class="jo-cab">
        <div class="jo-cab-txt">
          <span class="jo-eyebrow">Novo chamado técnico · rede ${NOME_CAT[cat]}</span>
          <h2 id="joTitulo"></h2>
          <p></p>
        </div>
        <button type="button" class="fechar" data-fechar aria-label="Fechar">×</button>
      </header>
      <div class="jo-corpo">
        <div class="jo-form">
          <section class="jo-sec">
            <h3>${tituloPortas} <small data-r="total"></small></h3>
            <div class="jo-portas">${porta(e, true)}${irmaos.map(x => porta(x, false)).join('')}</div>
          </section>
          <section class="jo-sec">
            <h3>Tipo de incidente</h3>
            <div class="jo-tipos" role="radiogroup" aria-label="Tipo de incidente">${tipos.map(t => `
              <label class="jo-tipo"><input type="radio" name="joTipo" value="${t.id}"${t.id === osForm.tipo ? ' checked' : ''}>
                <span class="jo-tipo-nome">${t.rotulo}</span><span class="jo-tipo-prazo">prazo de ${t.prazo}h</span>
                ${t.id === sugerido ? '<span class="jo-tag">sugerido</span>' : ''}</label>`).join('')}</div>
          </section>
          <section class="jo-sec jo-duas">
            <div>
              <h3><label for="joPrev">Previsão</label></h3>
              <input id="joPrev" type="datetime-local" value="${paraLocal(osForm.previsao)}">
              <div class="jo-atalhos">${[4, 6, 8].map(h => `<button type="button" data-h="${h}">+${h}h</button>`).join('')}</div>
              <small class="jo-dica" data-dica="prazo"></small>
            </div>
            <div>
              <h3><label for="joResp">Responsável</label></h3>
              <input id="joResp" list="joRespLista" autocomplete="off" maxlength="80" placeholder="Quem acompanha o chamado">
              <datalist id="joRespLista">${responsaveis.map(n => `<option value="${escHtml(n)}"></option>`).join('')}</datalist>
              <small class="jo-dica">Escolha da lista ou digite um nome novo.</small>
            </div>
          </section>
          <section class="jo-sec">
            <h3><label for="joCidade">Cidades afetadas</label></h3>
            <div class="jo-chips"></div>
            <input id="joCidade" list="joCidadesLista" autocomplete="off" placeholder="Digite para adicionar uma cidade">
            <datalist id="joCidadesLista">${cidades.map(n => `<option value="${escHtml(n)}"></option>`).join('')}</datalist>
          </section>
          <section class="jo-sec">
            <h3><label for="joDesc">Descrição</label></h3>
            <textarea id="joDesc" rows="3" maxlength="500"></textarea>
            <div class="jo-sugestoes">${sugestoes.map(t => `<button type="button" data-sug>${escHtml(t)}</button>`).join('')}</div>
          </section>
        </div>
      </div>
      <footer class="jo-rodape">
        <p class="jo-erro" role="alert"></p>
        <button type="button" class="btn-sm ghost" data-fechar>Cancelar</button>
        <button type="submit" class="btn-sm jo-principal">Abrir O.S. e gerar comunicado</button>
      </footer>
    </form>`;

    const $j = q => janelaOS.querySelector(q), erro = $j('.jo-erro');
    $j('#joTitulo').textContent = e.olt;
    const cidTxt = o.cidades?.length > 1 ? o.cidades.join(' / ') : o.cidade;
    $j('.jo-cab-txt p').textContent = [cidTxt, o.local, o.marca, `alarme às ${hhmm(e.ocorridoEm)} de ${dataHora(e.ocorridoEm).slice(0, 5)}`].filter(Boolean).join(' · ');
    $j('#joResp').value = osForm.responsavel;
    $j('#joDesc').value = osForm.descricao;

    const prazoPadrao = () => {
      if (osForm.previsaoManual) return;
      osForm.previsao = Date.now() + prazoDe(osForm.tipo) * 36e5;
      $j('#joPrev').value = paraLocal(osForm.previsao);
    };
    const atualizar = () => {
      $j('.jo-chips').innerHTML = osForm.cidades.map((c, i) => `<span class="of-chip">${escHtml(c)}<button type="button" data-i="${i}" aria-label="Remover ${escHtml(c)}">×</button></span>`).join('')
        || '<small class="jo-dica">Nenhuma cidade escolhida.</small>';
      const os = osDoForm(e);
      const nPortas = Math.max(1, os.portas.length);
      $j('[data-r="total"]').textContent = `${nf0.format(os.clientes)} clientes em ${nPortas} ${pluralPortas}`;
      $j('[data-dica="prazo"]').textContent = `Prazo do tipo escolhido: ${prazoDe(osForm.tipo)}h após a abertura.`;
      erro.textContent = '';
    };

    janelaOS.querySelectorAll('[data-fechar]').forEach(b => b.addEventListener('click', fecharJanelaOS));
    janelaOS.querySelectorAll('[data-ev]').forEach(cb => cb.addEventListener('change', () => {
      cb.checked ? osForm.eventos.add(cb.dataset.ev) : osForm.eventos.delete(cb.dataset.ev);
      if (!osForm.tipoManual) {
        osForm.tipo = tipoSugerido(osDoForm(e).clientes, e);
        const inp = janelaOS.querySelector(`input[name="joTipo"][value="${osForm.tipo}"]`);
        if (inp) inp.checked = true;
        prazoPadrao();
      }
      atualizar();
    }));
    janelaOS.querySelectorAll('input[name="joTipo"]').forEach(r => r.addEventListener('change', () => { osForm.tipo = r.value; osForm.tipoManual = true; prazoPadrao(); atualizar(); }));
    $j('#joPrev').addEventListener('change', ev => { const t = new Date(ev.target.value).getTime(); if (Number.isFinite(t)) { osForm.previsao = t; osForm.previsaoManual = true; } atualizar(); });
    janelaOS.querySelectorAll('[data-h]').forEach(b => b.addEventListener('click', () => {
      osForm.previsao = Date.now() + +b.dataset.h * 36e5; osForm.previsaoManual = true; $j('#joPrev').value = paraLocal(osForm.previsao); atualizar();
    }));
    $j('#joResp').addEventListener('input', ev => { osForm.responsavel = ev.target.value; atualizar(); });
    $j('#joDesc').addEventListener('input', ev => { osForm.descricao = ev.target.value; atualizar(); });
    janelaOS.querySelectorAll('[data-sug]').forEach(b => b.addEventListener('click', () => { osForm.descricao = b.textContent; $j('#joDesc').value = b.textContent; atualizar(); }));
    // cidades: escolher na lista (ou Enter) adiciona uma etiqueta
    const cidadeInput = $j('#joCidade');
    const adicionarCidade = () => {
      const v = cidadeInput.value.trim(); if (!v) return;
      const nome = CIDADES.map(c => c[0]).find(n => semAcento(n) === semAcento(v));
      if (!nome) { erro.textContent = `"${v}" não está na lista de cidades atendidas.`; return; }
      if (!osForm.cidades.includes(nome)) osForm.cidades.push(nome);
      cidadeInput.value = ''; atualizar();
    };
    cidadeInput.addEventListener('change', adicionarCidade);
    cidadeInput.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); adicionarCidade(); } });
    $j('.jo-chips').addEventListener('click', ev => { const b = ev.target.closest('button[data-i]'); if (b) { osForm.cidades.splice(+b.dataset.i, 1); atualizar(); } });

    $j('form').addEventListener('submit', async ev => {
      ev.preventDefault();
      const os = osDoForm(e);
      const falta = !os.cidades.length ? ['Escolha ao menos uma cidade afetada.', '#joCidade'] : !os.descricao.trim() ? ['Escreva a descrição.', '#joDesc']
        : !os.responsavel.trim() ? ['Informe o responsável.', '#joResp'] : !(os.previsao > Date.now()) ? ['A previsão precisa ser no futuro.', '#joPrev'] : null;
      if (falta) { erro.textContent = falta[0]; $j(falta[1]).focus(); return; }
      const bt = $j('.jo-principal');
      osForm.enviando = true; bt.disabled = true; bt.innerHTML = '<span class="spin"></span><span class="tx">Abrindo O.S.…</span>';
      try {
        const r = await fetch('api/rede/os', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ eventos: [...osForm.eventos], cidades: os.cidades, tipo: os.tipo, descricao: os.descricao, previsao: os.previsao, responsavel: os.responsavel }) });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.erro || `o servidor respondeu ${r.status}`);
        OSS.set(j.os.numero, j.os);
        j.eventos.forEach(x => EVENTOS.set(x.id, normalizarEvento(x)));
        osForm.enviando = false; osForm.aberta = j.os;
        // por trás da janela, o chamado continua selecionado (sai da Triagem, então a lista mostra todos)
        if (ui.redeSt !== 'todos') { ui.redeSt = 'todos'; store.set('redeSt', ui.redeSt); }
        ui.redeSel = e.id;
        render();
        montarSucessoOS(e, j.os);
      } catch (err) {
        osForm.enviando = false; bt.disabled = false; bt.textContent = 'Abrir O.S. e gerar comunicado';
        erro.textContent = `Não foi possível abrir a O.S.: ${err.message}.`;
      }
    });
    atualizar();
  }

  // depois de abrir: check animado e o número da O.S.; o comunicado aparece sem destaque (vai para o grupo do CGR)
  function montarSucessoOS(e, o) {
    const cat = categoriaDe(o), pluralPortas = ROTULO_PORTAS_PLURAL[cat] || 'portas';
    janelaOS.innerHTML = `<div class="jo-caixa jo-ok">
      <header class="jo-cab">
        <div class="jo-cab-txt"><span class="jo-eyebrow">Chamado técnico aberto · ${NOME_CAT[cat]}</span><h2 id="joTitulo"></h2></div>
        <button type="button" class="fechar" data-fechar aria-label="Fechar">×</button>
      </header>
      <div class="jo-sucesso animar">${CHECK}<h3>O.S. aberta e comunicado gerado</h3>
        <p>Ordem de serviço <b></b> · comunicado <b>${o.id}</b> · ${Math.max(1, o.portas.length)} ${pluralPortas} · ${nf0.format(o.clientes)} clientes</p>
        ${wppHtml(o)}</div>
      <div class="jo-com">
        <div class="inc-com-cab"><h4>Comunicado</h4><button type="button" class="btn-link" data-copiar>Copiar para encaminhar ao supervisor</button></div>
        <pre class="rd-comunicado"></pre>
      </div>
      <footer class="jo-rodape"><button type="button" class="btn-sm ghost" data-ver-inc>Ver em Incidentes</button><button type="button" class="btn-sm jo-principal" data-fechar>Concluir</button></footer>
    </div>`;
    const $j = q => janelaOS.querySelector(q), pre = $j('pre');
    $j('#joTitulo').textContent = e.olt;
    $j('.jo-sucesso p b').textContent = o.numero;
    pre.textContent = textoComunicado(o);
    janelaOS.querySelectorAll('[data-fechar]').forEach(b => b.addEventListener('click', fecharJanelaOS));
    $j('[data-ver-inc]').addEventListener('click', () => { fecharJanelaOS(); abrirOSNosIncidentes(o.numero); });
    $j('[data-copiar]').addEventListener('click', ev => copiarComunicado(ev.currentTarget, pre.textContent, pre));
    $j('[data-reenviar]')?.addEventListener('click', () => { fecharJanelaOS(); abrirOSNosIncidentes(o.numero); }); // reenvio fica no cartão
    $j('.jo-principal').focus();
  }

  let baixaAberta = null, formAcao = 'encerrar', rascunhoBaixa = ''; // campo de mensagem aberto (id do evento), a ação dele e o texto digitado
  const MSG_ACAO = {
    encerrar: { rotulo: 'Mensagem de baixa', confirmar: 'Confirmar baixa',
      exemplo: 'Ex.: energia restabelecida pela concessionária, clientes voltaram às 20:10.',
      vazio: 'Escreva a mensagem de baixa: o que aconteceu e como foi resolvido.' },
    acompanhar: { rotulo: 'Mensagem para o acompanhamento', confirmar: 'Mandar para acompanhamento',
      exemplo: 'Ex.: maioria dos afetados avisou falta de energia antes de cair; concessionária com previsão de religar às 21:00.',
      vazio: 'Escreva por que o chamado vai para acompanhamento.' }
  };
  async function acaoRede(e, acao, detalhe = '') {
    acaoEmCurso = { id: e.id, acao }; renderRede();
    try {
      const rota = acao === 'consultar' ? 'api/rede/consultar' : 'api/rede/acao';
      const r = await fetch(rota, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: e.id, acao, detalhe }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.erro || `o servidor respondeu ${r.status}`);
      EVENTOS.set(j.id, normalizarEvento(j));
      acaoRecente = { id: j.id, acao };
      if (MSG_ACAO[acao]) rascunhoBaixa = '';
    } catch (err) {
      erroAcao = { id: e.id, msg: `Não foi possível concluir: ${err.message}. Tente de novo.` };
      if (MSG_ACAO[acao]) { baixaAberta = e.id; formAcao = acao; } // o texto continua no campo
    }
    acaoEmCurso = null;
    if (ui.aba === 'rede') renderRede(); else atualizarBadgeRede();
  }
  const digitandoNaRede = () => redeEl.contains(document.activeElement) && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  let redePendente = false;
  const agendarRede = () => {
    if (redePendente) return;
    redePendente = true;
    setTimeout(() => {
      redePendente = false;
      if (ui.aba === 'rede' && !acaoEmCurso && !baixaAberta && !digitandoNaRede()) renderRede(); else atualizarBadgeRede();
      if (ui.aba === 'inc') renderIncidentes();
      atualizarBadge();
    }, 300);
  };

  // ---------- tempo real (só quando aberta pelo servidor) ----------
  if (SERVIDOR) {
    let ultimoPonteiro = null, pendente = false;
    hm.addEventListener('pointermove', e => { ultimoPonteiro = [e.clientX, e.clientY]; });
    hm.addEventListener('pointerleave', () => { ultimoPonteiro = null; });
    const atualizarTempo = () => { agora = Date.now(); hoje = new Date(agora); limparCache(); };
    function redesenhar() {
      atualizarTempo(); render(); verificarAlertas();
      // devolve o hover para a célula que estava sob o mouse
      const el = ultimoPonteiro && document.elementFromPoint(...ultimoPonteiro)?.closest('.cell');
      if (el) { setHot(el); placeTip(...ultimoPonteiro); }
    }
    // várias O.S. em sequência viram um único redesenho
    const agendar = () => { if (pendente) return; pendente = true; setTimeout(() => { pendente = false; redesenhar(); }, 250); };
    const receber = lista => { let houve = false; for (const o of lista) houve = indexarOS(daWebhook(o)) || houve; if (houve) agendar(); };

    const fonte = new EventSource('eventos');
    let ola = false;
    fonte.addEventListener('ola', () => { ola = true; });
    fonte.addEventListener('os', e => { try { receber(JSON.parse(e.data)); } catch {} });
    fonte.addEventListener('rede', e => { try { receberEvento(JSON.parse(e.data), true); agendarRede(); } catch {} });
    fonte.addEventListener('os-tecnica', e => { try { const o = JSON.parse(e.data); OSS.set(o.numero, o); agendarRede(); } catch {} });
    fonte.addEventListener('alarmes', e => { try { BUSCA_ALARMES = JSON.parse(e.data); agendarRede(); } catch {} });
    fonte.addEventListener('rede-config', e => { try { margemAtual = JSON.parse(e.data).margem; agendarRede(); } catch {} });
    const buscarRede = () => fetch('api/rede', { cache: 'no-store' }).then(r => r.json())
      .then(lista => { let mudou = false; for (const ev of lista) { const antes = EVENTOS.get(ev.id); if (!antes || JSON.stringify(antes) !== JSON.stringify(ev)) { receberEvento(ev, true); mudou = true; } } if (mudou) agendarRede(); })
      .catch(() => {});
    // ao conectar e ao reconectar, busca a lista completa para cobrir o que chegou no intervalo
    fonte.addEventListener('open', () => { fetch('api/os', { cache: 'no-store' }).then(r => r.json()).then(receber).catch(() => {}); buscarRede(); });
    // Alguns proxies seguram o fluxo de eventos (o túnel temporário da Cloudflare não entrega SSE).
    // Se o "ola" do servidor não chegar, a página passa a consultar só as O.S. novas a cada 5 s.
    setTimeout(() => {
      if (ola) return;
      fonte.close();
      let vistas = (SERVIDOR.os || []).length;
      const consultar = () => fetch(`api/os?depois=${vistas}`, { cache: 'no-store' })
        .then(r => r.json()).then(j => { vistas = j.total; receber(j.os || []); }).catch(() => {});
      const buscarOS = () => fetch('api/rede/os', { cache: 'no-store' }).then(r => r.json()).then(l => { l.forEach(o => OSS.set(o.numero, o)); }).catch(() => {});
      consultar(); buscarRede(); buscarOS();
      setInterval(() => { consultar(); buscarRede(); buscarOS(); }, 5000);
    }, 6000);
    // o relógio anda mesmo sem O.S. nova (virada de hora e de dia)
    setInterval(() => { if (!arraste) redesenhar(); }, 60000);
  }

  // ---------- menus ----------
  document.getElementById('menu').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    ui.aba = b.dataset.aba; store.set('aba', ui.aba); render();
  });
  // seletor de filial: botões gerados a partir de FILIAIS
  const navFilial = document.getElementById('filial');
  for (const f of FILIAIS) {
    const b = document.createElement('button'); b.type = 'button'; b.dataset.filial = f.id; b.textContent = f.id; b.title = `Filial ${f.id} · ${f.nome}`;
    navFilial.appendChild(b);
  }
  navFilial.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    ui.filial = b.dataset.filial; store.set('filial', ui.filial); render();
  });
  document.getElementById('filtro').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    ui.filtro = b.dataset.filtro; store.set('filtro', ui.filtro); render();
  });
  document.getElementById('subrede').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    ui.redeSt = b.dataset.st; store.set('redeSt', ui.redeSt); redeDetalhe = false; render();
  });
  document.getElementById('subtriagem').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    ui.redeCat = b.dataset.cat; store.set('redeCat', ui.redeCat); redeDetalhe = false; render();
  });
  document.getElementById('subinc').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    ui.incSt = b.dataset.st; store.set('incSt', ui.incSt); render();
  });
  document.getElementById('submenu').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    ui.gran = b.dataset.gran; store.set('gran', ui.gran); render();
  });

  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
  new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  render();
  verificarAlertas();
})();
</script>
<script>
(() => {
  // perfil: tema e sair
  const ls = { get: k => { try { return localStorage.getItem('termografo.' + k); } catch { return null; } }, set: (k, v) => { try { v ? localStorage.setItem('termografo.' + k, v) : localStorage.removeItem('termografo.' + k); } catch {} } };
  const bt = document.getElementById('perfilBt'), menu = document.getElementById('perfilMenu');
  const ICONE = bt.innerHTML;
  const iniciais = n => n.split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0]).join('').toUpperCase();
  function pintar() {
    const nome = '';
    bt.innerHTML = nome ? iniciais(nome) : ICONE;
    bt.title = nome ? `Perfil · ${nome}` : 'Perfil';
    document.getElementById('perfilAv').innerHTML = nome ? iniciais(nome) : ICONE;
    document.getElementById('perfilNome').textContent = nome || 'Operador CGR';
    let desde = null; try { desde = +sessionStorage.getItem('termografo.entradaEm') || null; } catch {}
    const d = desde && new Date(desde);
    document.getElementById('perfilDesde').textContent = d ? `Entrou às ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}` : 'Sessão ativa';
    const tema = ls.get('tema') || '';
    menu.querySelectorAll('[data-tema]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tema === tema)));
  }
  const semMov = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const esconder = () => { if (bt.getAttribute('aria-expanded') === 'false') menu.hidden = true; };
  const abrir = sim => {
    bt.setAttribute('aria-expanded', String(sim));
    if (sim) { menu.hidden = false; pintar(); return; }
    if (menu.hidden) return;
    if (semMov || !menu.animate) { menu.hidden = true; return; }
    menu.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-4px) scale(.98)' }], { duration: 130, easing: 'cubic-bezier(.4, 0, 1, 1)' })
      .onfinish = esconder;
    setTimeout(esconder, 220); // garante mesmo sem quadros (aba em segundo plano)
  };
  bt.addEventListener('click', () => abrir(bt.getAttribute('aria-expanded') !== 'true'));
  document.addEventListener('pointerdown', e => { if (!menu.hidden && !document.getElementById('perfil').contains(e.target)) abrir(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !menu.hidden) { abrir(false); bt.focus(); } });
  document.getElementById('perfilTema').addEventListener('click', e => {
    const b = e.target.closest('[data-tema]'); if (!b) return;
    ls.set('tema', b.dataset.tema);
    if (b.dataset.tema) document.documentElement.dataset.theme = b.dataset.tema; else delete document.documentElement.dataset.theme;
    pintar();
  });
  document.getElementById('perfilSair').addEventListener('click', () => {
    try { sessionStorage.removeItem('termografo.entrada'); sessionStorage.removeItem('termografo.entradaEm'); } catch {}
    location.reload(); // volta para a tela de entrada
  });
  pintar();
})();
</script>
</body>
